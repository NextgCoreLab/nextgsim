[package]
name = "nextgsim-sctp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SCTP transport layer for nextgsim"

[lints]
workspace = true

[features]
# Off by default. Enables the real kernel-SCTP transport backend
# (`KernelSctpAssociation`) which speaks SCTP (IP proto 132) via the OS
# kernel and lksctp/libsctp. Only meaningful on Linux; requires libsctp
# (`libsctp-dev`, providing `-lsctp`) at link time. The userspace
# sctp-proto-over-UDP backend remains the default regardless of this feature.
kernel-sctp = ["dep:socket2", "dep:libc"]

[dependencies]
# The SCTP constants and ReceivedMessage are consumed from nextgcore rather than
# redefined here (#205). Pinned by REV, not tag, to the nextgcore commit the
# cross-repo E2E validated: run 36409112147 paired nextgcore bf3dbd8 with
# nextgsim 67a0d79. default-features = false: only the shared core is wanted,
# not nextgcore's sctp-proto SERVER. Bump procedure: docs/nextgcore-integration.md.
nextgcore-sctp = { git = "https://github.com/NextgCoreLab/nextgcore", rev = "bf3dbd800376db8ec2aa44a04dbb299b5c5e40a0", default-features = false }
nextgsim-common.workspace = true
tokio.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
sctp-proto.workspace = true
quinn.workspace = true
rcgen.workspace = true
rustls.workspace = true

# Only used by the `kernel-sctp` feature (Linux kernel SCTP backend).
socket2 = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
