[workspace]
resolver = "2"
members = [
    "nextgsim-common",
    "nextgsim-crypto",
    "nextgsim-nas",
    "nextgsim-eps-nas",
    "nextgsim-ngap",
    "nextgsim-s1ap",
    "nextgsim-lte-rrc",
    "nextgsim-lte-ue",
    "nextgsim-rrc",
    "nextgsim-rls",
    "nextgsim-rlc",
    "nextgsim-pdcp",
    "nextgsim-gtp",
    "nextgsim-sctp",
    "nextgsim-gnb",
    "nextgsim-enb",
    "nextgsim-ue",
    "nextgsim-cli",
    "nextgsim-ai",
    "nextgsim-she",
    "nextgsim-nwdaf",
    "nextgsim-nkef",
    "nextgsim-isac",
    "nextgsim-agent",
    "nextgsim-fl",
    "nextgsim-semantic",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["nextgsim contributors"]
license = "AGPL-3.0"
repository = "https://github.com/nextgsim/nextgsim"
description = "Pure Rust 5G UE and gNB simulator"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"

# Cryptography (pure Rust)
aes = "0.8"
ctr = "0.9"
cmac = "0.7"
sha2 = "0.10"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
zuc = "0.1"

# Networking
socket2 = "0.5"
sctp-proto = "0.6"
tun-rs = { version = "1", features = ["async_tokio"] }
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Utilities
bytes = "1"
bitflags = "2"
num_enum = "0.7"
hex = "0.4"
async-trait = "0.1"

# ASN.1 PER codec (for NGAP/RRC) and compiler: hampi 0.7.2 forked with our
# conformance fixes, which now live in their own repository,
# NextgCoreLab/asn1-codegen, pinned to its v0.1.0 release by rev (6d75c49) so a
# moved tag can never change what builds. They used to be vendored here under
# vendor/; nextgcore consumed them from this repo, so the core network depended
# on the simulator. Every fix and its standard is listed in asn1-codegen's
# README; the two most consequential are kept below for context.
#
# #117: Upstream 0.7.2 REFUSES to encode a CHOICE whose
# selected alternative is past the ASN.1 extension marker -- `encode_choice_idx_common`
# returns `EncodeNotSupported` -- so every extension-arm IE in the vendored
# RRC/NGAP schemas was decode-only and `measResultListEUTRA` (inter-RAT
# measurement reporting) could not go on the wire at all. The fork implements
# X.691 §23.6 (extension index as a normally small non-negative whole number) and
# §23.8 (the arm's value as a length-prefixed open type) in both the codec and the
# derive macro. See specs/extended-choice-per-encode.md.
asn1-codecs = { git = "https://github.com/NextgCoreLab/asn1-codegen.git", rev = "6d75c4962d09dcdb75eee7e4b8c03b14def2f123" }
asn1_codecs_derive = { git = "https://github.com/NextgCoreLab/asn1-codegen.git", rev = "6d75c4962d09dcdb75eee7e4b8c03b14def2f123" }
bitvec = "1"
log = "0.4"
env_logger = "0.11"
# #185: Upstream 0.7.2 silently DROPS an
# information-object-class field written inline as a base type rather than as a
# named type reference -- in NGAP, `TYPE OCTET STRING (CONTAINING <Transfer>)`.
# The variant is omitted from the generated OPEN-type enum with no error, so
# decoding a PDU carrying that IE fails with `Key <id> Not Found`. In TS 38.413
# V17.9 this hit 14 ProtocolIE entries, ALL of them MBS, including IE 304
# (id-MulticastSessionActivationRequestTransfer) -- one of the two mandatory IEs
# of MulticastSessionActivationRequest. So the gNB could not decode an MBS
# session activation at all. The fork accepts any resolved type at that site;
# the change is purely additive (19 IE variants gained, none removed or
# retyped). See asn1-compiler/src/resolver/asn/types/constructed.rs in
# asn1-codegen.
asn1-compiler = { git = "https://github.com/NextgCoreLab/asn1-codegen.git", rev = "6d75c4962d09dcdb75eee7e4b8c03b14def2f123" }

# Property-based testing (dev-dependency only: generator-driven codec round trips)
proptest = "1"

# Internal crates
nextgsim-common = { path = "nextgsim-common" }
nextgsim-crypto = { path = "nextgsim-crypto" }
nextgsim-nas = { path = "nextgsim-nas" }
nextgsim-eps-nas = { path = "nextgsim-eps-nas" }
nextgsim-ngap = { path = "nextgsim-ngap" }
nextgsim-s1ap = { path = "nextgsim-s1ap" }
nextgsim-lte-rrc = { path = "nextgsim-lte-rrc" }
nextgsim-lte-ue = { path = "nextgsim-lte-ue" }
nextgsim-rrc = { path = "nextgsim-rrc" }
nextgsim-rls = { path = "nextgsim-rls" }
nextgsim-rlc = { path = "nextgsim-rlc" }
nextgsim-pdcp = { path = "nextgsim-pdcp" }
nextgsim-gtp = { path = "nextgsim-gtp" }
nextgsim-sctp = { path = "nextgsim-sctp" }
nextgsim-gnb = { path = "nextgsim-gnb" }
nextgsim-ue = { path = "nextgsim-ue" }
nextgsim-cli = { path = "nextgsim-cli" }

# AI/ML crates (6G AI-native network functions)
nextgsim-ai = { path = "nextgsim-ai" }
nextgsim-she = { path = "nextgsim-she" }
nextgsim-nwdaf = { path = "nextgsim-nwdaf" }
nextgsim-nkef = { path = "nextgsim-nkef" }
nextgsim-isac = { path = "nextgsim-isac" }
nextgsim-agent = { path = "nextgsim-agent" }
nextgsim-fl = { path = "nextgsim-fl" }
nextgsim-semantic = { path = "nextgsim-semantic" }

# ONNX Runtime for ML inference
ort = { version = "2.0.0-rc.11", features = ["load-dynamic"] }

# ndarray for tensor operations
ndarray = { version = "0.15", features = ["serde"] }

# Half-precision floats
half = { version = "2", features = ["serde"] }

# Workspace-wide lint configuration
[workspace.lints.clippy]
# Correctness
enum_glob_use = "deny"

# Style
redundant_closure_for_method_calls = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"

# Performance
unnecessary_to_owned = "warn"
inefficient_to_string = "warn"

# Redirect the TRANSITIVE edge onto the fork as well (#117).
#
# The git entry in `[workspace.dependencies]` only rebinds what our own crates
# name directly. `asn1-codecs` is ALSO a dependency of `asn1_codecs_derive` (pinned
# `=0.7.2`) and of `asn1-compiler`, which the RRC/NGAP build scripts run. Without
# this patch those edges resolve to the unfixed registry copy, so one build would
# contain two different `asn1-codecs` -- the derive macro emitting calls against a
# codec whose extended-CHOICE encoder still refuses. The symptom would be a type
# error or, worse, a silent split where the fix appears not to take effect.
# `asn1-compiler` is patched here too (#185) so that any crate reaching it
# transitively regenerates from the fixed resolver rather than from the registry
# copy that drops the inline-CONTAINING IEs.
[patch.crates-io]
asn1-codecs = { git = "https://github.com/NextgCoreLab/asn1-codegen.git", rev = "6d75c4962d09dcdb75eee7e4b8c03b14def2f123" }
asn1_codecs_derive = { git = "https://github.com/NextgCoreLab/asn1-codegen.git", rev = "6d75c4962d09dcdb75eee7e4b8c03b14def2f123" }
asn1-compiler = { git = "https://github.com/NextgCoreLab/asn1-codegen.git", rev = "6d75c4962d09dcdb75eee7e4b8c03b14def2f123" }
# sctp-proto 0.6.0 patched to carry any SCTP PPID verbatim (#220): upstream
# (0.6.0 and 0.10.7 alike) maps every non-WebRTC PPID to `Unknown`, sent as 58.
# The patched crate has ONE home, nextgcore's src/vendor/sctp-proto (nextgcore
# #467/#468; see its HOME.md and NEXTGSIM-PATCH.md), consumed here by git rev
# (#230) rather than vendored a second time -- two copies of one patch drift,
# which is what #205 exists to prevent. Cargo finds the crate inside the nextgcore
# checkout by name even though it is excluded from nextgcore's workspace.
#
# The rev differs from nextgcore-sctp's on purpose: nextgcore-sctp stays pinned to
# the E2E-validated pair (bf3dbd8, see nextgsim-sctp/Cargo.toml and
# docs/nextgcore-integration.md), which predates #468 and so has no
# src/vendor/sctp-proto. This rev only has to contain #468; bump it whenever the
# patch changes in nextgcore. When nextgcore-sctp is next bumped to a validated
# pair at or after f428e6c, the two revs can be unified.
#
# b168041 (nextgcore #813 / #870) adds RFC 9260 §5.1.1 stream negotiation: the
# outbound stream count is bounded by the peer's MIS, not its OS, and
# `Association::max_num_outbound_streams()` reports it (nextgsim #335).
sctp-proto = { git = "https://github.com/NextgCoreLab/nextgcore", rev = "b16804170f983b9df203b78234c9c190238010f8" }
