[package]
name = "nextgsim-ue"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "5G UE (User Equipment) simulator binary"

[features]
default = []
# In-process topic pub/sub bus for cross-cutting 6G observations (issue #16).
# Off by default; forwards to nextgsim-common's own feature.
event-bus = ["nextgsim-common/event-bus"]
# UUAA-MM: originate UAS service-level authentication over UL NAS TRANSPORT
# (issue #58, TS 23.256 §5.2.2). Off by default, so the default build keeps the
# registration-marker-only behaviour. The gate is on ORIGINATING an exchange,
# not on decoding one: a Service-level-AA container the network sends is always
# understood and applied, because a UE that ignored a revocation because a cargo
# feature was off would keep flying on a withdrawn authorization.
uuaa-mm = []
# Per-DRB PDCP entity on the user plane (issue #33, TS 38.323 §5.2). Off by
# default: interposing a sublayer reshapes the live data path, so the default
# build keeps RLC wired straight to NAS. With it on, a DRB gains a PDCP header,
# an SN, a 32-bit COUNT, in-order delivery and a discardTimer.
drb-pdcp = []
# User-plane (DRB) PDCP integrity protection and ciphering with K_UPenc/K_UPint
# (issue #32, TS 38.323 5.8/5.9, TS 33.501 6.6). Off by default and implies
# `drb-pdcp`, because the COUNT ciphering is keyed on is the PDCP entity's state:
# without an entity there is nothing to protect. Both ends must agree -- a UE with
# it on and a gNB with it off would cipher uplink the gNB reads as plaintext.
up-security = ["drb-pdcp"]
# SDAP on the user plane: the UE strips the one-octet DL SDAP header and prepends
# one on the uplink, and its DRBs are keyed by DRB identity rather than by PSI
# (issue #44, TS 37.324 §5.1/§6.2.2). Off by default and for the same reason as on
# the gNB: a UE that stripped a header a gNB never prepended would eat the first
# octet of every downlink IP packet. The mapping is not recomputed here -- it is
# read out of the `SDAP-Config` the network signalled, so the network's policy can
# change without a matching UE change.
sdap-dataplane = []
# Sidelink / ProSe PC5 surface (issues #54 and #141, TS 23.304, TS 24.554).
#
# Since issue #141 this gates WORKING procedures, not a facade: a PC5-S
# `Direct Communication Request`/`Accept` handshake before a unicast link is usable,
# Model A/B direct discovery as a real exchange, UE-to-UE relay forwarding against the
# live link table, and an RRC `SidelinkUEInformation` resource request answered by an
# `sl-ConfigDedicatedNR` grant. (#141's recorded blocker -- the vendored RRC schema had
# zero sidelink IEs -- died when #105 vendored the Rel-19 schema.)
#
# Still off by default, for two reasons that survive #141: PC5 is not a capability a
# default UE should advertise, and the gate is what keeps this module out of the lean
# `cargo test --workspace` build. `UeConfig::prose_enabled` is the RUNTIME half of the
# gate -- with the feature on but the flag off, the task registers and idles.
#
# What is NOT here, and is not stubbed: there is no PC5 radio (the medium is an
# in-process channel), and no UE-to-Network relay -- that needs the TS 38.351 SRAP
# adaptation layer, and is filed as issue #190.
#
# `prose.rs` used to ride this feature; #141 removed it, because every one of its types
# had zero consumers and the procedures it modelled are now implemented for real in
# `sidelink::{pc5s, link, discovery, relay}`. See the note in `src/lib.rs`.
sidelink = []

[lints]
workspace = true

[[bin]]
name = "nr-ue"
path = "src/main.rs"

[dependencies]
nextgsim-common.workspace = true
nextgsim-crypto.workspace = true
nextgsim-nas.workspace = true
nextgsim-rrc.workspace = true
nextgsim-rls.workspace = true
nextgsim-rlc.workspace = true
nextgsim-pdcp.workspace = true
nextgsim-gtp.workspace = true

# 6G AI-native network function client crates (optional features for UE)
nextgsim-she = { workspace = true, optional = true }
nextgsim-nwdaf = { workspace = true, optional = true }
nextgsim-nkef = { workspace = true, optional = true }
nextgsim-isac = { workspace = true, optional = true }
nextgsim-agent = { workspace = true, optional = true }
nextgsim-fl = { workspace = true, optional = true }
nextgsim-semantic = { workspace = true, optional = true }

bitvec.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true
bytes.workspace = true
rand.workspace = true
tun-rs.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
