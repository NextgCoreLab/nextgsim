[package]
name = "nextgsim-sbi-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "h2c SBI client for gNB/UE 6G tasks calling nextgcore NFs: JSON, timeouts, idempotent-only retries, optional fail-closed NRF OAuth2 (#457)"

[lints]
workspace = true

[features]
# Builds `sbi-roundtrip`, the nightly's NRF + NWDAF round trip (#457). Off by
# default, so a workspace build compiles only the library.
roundtrip = []

[[bin]]
name = "sbi-roundtrip"
path = "src/bin/sbi-roundtrip.rs"
required-features = ["roundtrip"]

[dependencies]
h2 = "0.4"
http = "1"
bytes.workspace = true
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros"] }
serde.workspace = true
serde_json.workspace = true
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
hex.workspace = true
rand.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber.workspace = true
