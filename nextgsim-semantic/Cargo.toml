[package]
name = "nextgsim-semantic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Semantic Communication Protocols - Task-relevant feature transmission for 6G networks"

[features]
default = []
# Resolve models from the shared nextgsim-ai registry (issue #17). Additive:
# the existing direct load_model paths are untouched.
model-registry = ["nextgsim-ai/model-registry"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
nextgsim-ai = { workspace = true }
nextgsim-common = { workspace = true }
ndarray = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }

[lints]
workspace = true
