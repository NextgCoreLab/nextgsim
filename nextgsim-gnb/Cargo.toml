[package]
name = "nextgsim-gnb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "5G gNB (gNodeB) simulator binary"

[lints]
workspace = true

[features]
# The h2c SBI client a 6G task uses to call nextgcore NFs (#457). Off by default,
# so a default build has no HTTP/2 stack; CI checks that with cargo tree. The
# first consumer (the RAN -> nwdafd demo) wires it in.
sbi-client = ["dep:nextgsim-sbi-client"]

# In-process topic pub/sub bus for cross-cutting 6G observations (issue #16).
# Off by default; forwards to nextgsim-common's own feature.
event-bus = ["nextgsim-common/event-bus"]
# Off by default. Enables the kernel-SCTP transport backend in nextgsim-sctp
# so the gNB can associate with a real / Open5GS AMF over kernel SCTP (proto
# 132). Only effective on Linux; requires libsctp (`-lsctp`) at link time.
kernel-sctp = ["nextgsim-sctp/kernel-sctp"]
# Per-DRB PDCP entity on the user plane (issue #33, TS 38.323 §5.2). Off by
# default: interposing a sublayer reshapes the live data path, so the default
# build keeps RLC wired straight to GTP-U. Both ends must agree -- a gNB with the
# feature on and a UE with it off would have the UE read a PDCP header as payload.
drb-pdcp = []
# User-plane (DRB) PDCP integrity protection and ciphering with K_UPenc/K_UPint
# (issue #32, TS 38.323 5.8/5.9, TS 33.501 6.6). Off by default and implies
# `drb-pdcp`, because the COUNT ciphering is keyed on is the PDCP entity's state:
# without an entity there is nothing to protect. Both ends must agree -- a gNB
# with it on and a UE with it off has the UE read a MAC-I as payload and fail
# every integrity check, which takes the user plane down rather than degrading it.
up-security = ["drb-pdcp"]
# SDAP on the user plane: the QFI picks the DRB, and a one-octet SDAP header
# carries the QFI and RQI (issue #44, TS 37.324 §5.1/§6.2.2). Off by default for
# the reason `drb-pdcp` records, one octet earlier in the stack: this interposes a
# sublayer on the live data path, and a gNB that prepends an SDAP header to a UE
# that does not strip it has the UE read the header as the first octet of its IP
# packet. Both ends must agree, and the default build keeps the PSI-selected path
# byte-for-byte as it was.
#
# The feature also turns one DRB per PDU session into two (default + GBR), which
# re-keys the RLC and PDCP entity maps from the PSI to the DRB identity. The
# DEFAULT DRB keeps the identity the PSI produced, so a session with one QoS flow
# is numbered identically either way.
sdap-dataplane = []

# Demo D446A (nextgsim#483, convention #458): load-balancing vs energy-saving
# agents arbitrated over a booster cell. Off by default; demo-only code, and it
# needs the Agent task. Active only with the demo: block on as well.
demo-d446a-agent-conflict = ["nextgsim-agent"]

# Demo D440A (nextgsim#462, convention #458): model-predicted paging. Off by
# default; demo-only code, inert unless the config's `demo:` block also enables
# `d440a-ai-paging`. At UE CONTEXT RELEASE the NWDAF task predicts the UE's next
# gNB (modes last-served, ct, lsq, onnx) and the Release Complete carries it in
# Information on Recommended Cells and RAN Nodes for Paging; mode page-all sends
# no IE. Needs the 6G NWDAF task, and `model-registry` for the `onnx` arm (a
# d440b-verified model).
demo-d440a-ai-paging = ["6g", "model-registry"]

# Demo D441D (nextgsim#467, convention #458): predictive N2 handover from the
# gNB NWDAF vs A3, a seeded A/B. Off by default; demo-only code, inert unless
# the config's `demo:` block also enables `d441d-predictive-ho`. Needs the 6G
# NWDAF task, and `model-registry` for the `onnx` arm (a d440b-verified model).
demo-d441d-predictive-ho = ["6g", "model-registry"]

# Demo D441A (nextgsim#465, convention #458): a configured cell capacity C, a
# token-bucket downlink queue at C, and an exporter that POSTs the measured (and,
# in mode `prediction`, the OLS-predicted) cell occupancy to nwdafd's
# non-normative /nnwdaf-randata/v1/cell-reports route with an NRF-issued token.
# Off by default; demo-only code, inert unless the config's `demo:` block also
# enables `d441a-congestion-loop`.
demo-d441a-congestion-loop = ["6g", "sbi-client"]

# Demo D440C (nextgsim#464, convention #458): NWDAF UE-mobility analytics steer
# AMF paging. On the gNB the demo only LOGS the PAGING's Assistance Data for
# Paging (`[demo:d440c-nwdaf-paging] PAGING assistance: cells=[..] attempt k/n`);
# decoding the IE is base NGAP (TS 38.413 §9.3.1.69) and needs no feature. Off by
# default; inert unless the config's `demo:` block also enables
# `d440c-nwdaf-paging`. Implies `6g`, the gNB gate the ticket names.
demo-d440c-nwdaf-paging = ["6g"]

# Umbrella feature enabling the five optional 6G / AI-native research crates at
# once. (The gNB FL aggregator was removed in nextgsim#480: federated learning
# is an application-layer AF, `nr-fl-server`, on the N6 side, not a gNB task.)
# Off by default, so `cargo build -p nextgsim-gnb` yields a lean 5G gNB and
# `cargo build -p nextgsim-gnb --features 6g` yields the full build. There is no
# frozen 3GPP Rel-20/6G Stage-3 spec behind these crates.
6g = [
    "nextgsim-she",
    "nextgsim-nwdaf",
    "nextgsim-nkef",
    "nextgsim-isac",
    "nextgsim-agent",
]

# Demo d447a-nkef-live (nextgsim#488): NKEF's live RLS / N2 tees, its h2c SBA
# client toward amfd and the NRF, and the bundle answer to `nr-cli nkef-query`.
# Off by default, and inert unless the config's `demo.d447a-nkef-live` block
# also enables it (the #458 toggle convention).
nkef-sba = ["nextgsim-nkef", "sbi-client"]

# Verified model loading with serving counters (nextgsim#463, demo
# `d440b-model-verify`). Off by default. Implies the NWDAF crate (the task still
# needs `nwdaf_enabled: true`) and forwards to its `model-registry`, so the model
# at `nwdaf_model_path` is activated only after its manifest's sha256, opset,
# shapes and golden vectors pass, every trajectory prediction is counted by
# method, and `nr-cli <gnb> nwdaf-status` answers. Registers the
# `d440b-model-verify` demo (modes verify, fallback). Golden vectors need ONNX
# Runtime >= 1.23 at runtime (`ORT_DYLIB_PATH`); without it the model is refused
# as `runtime unavailable`, never a crash. A build without this feature,
# `6g` included, is unchanged and needs no libonnxruntime.
model-registry = ["nextgsim-nwdaf", "nextgsim-nwdaf/model-registry"]

[[bin]]
name = "nr-gnb"
path = "src/main.rs"

[lib]
name = "nextgsim_gnb"
path = "src/lib.rs"

[dependencies]
nextgsim-common.workspace = true
nextgsim-sbi-client = { workspace = true, optional = true }
nextgsim-demo.workspace = true
nextgsim-crypto.workspace = true
nextgsim-ngap.workspace = true
nextgsim-rrc.workspace = true
nextgsim-rls.workspace = true
nextgsim-rlc.workspace = true
nextgsim-pdcp.workspace = true
nextgsim-gtp.workspace = true
nextgsim-sctp.workspace = true

# 6G AI-native network function crates (optional, off by default — gated behind
# the `6g` umbrella feature above / the per-crate `nextgsim-*` features).
nextgsim-she = { workspace = true, optional = true }
nextgsim-nwdaf = { workspace = true, optional = true }
nextgsim-nkef = { workspace = true, optional = true }
nextgsim-isac = { workspace = true, optional = true }
nextgsim-agent = { workspace = true, optional = true }

log.workspace = true
tracing-log.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait = "0.1"
thiserror.workspace = true
serde_yaml.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true

[dev-dependencies]
# A fake h2c amfd for the NKEF SBA tests (nextgsim#488); already in the lock
# through nextgsim-sbi-client.
h2 = "0.4"
http = "1"
bytes.workspace = true
tempfile = "3"
