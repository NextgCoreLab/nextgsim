[package]
name = "nextgsim-gnb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "5G gNB (gNodeB) simulator binary"

[lints]
workspace = true

[features]
# Off by default. Enables the kernel-SCTP transport backend in nextgsim-sctp
# so the gNB can associate with a real / Open5GS AMF over kernel SCTP (proto
# 132). Only effective on Linux; requires libsctp (`-lsctp`) at link time.
kernel-sctp = ["nextgsim-sctp/kernel-sctp"]

[[bin]]
name = "nr-gnb"
path = "src/main.rs"

[lib]
name = "nextgsim_gnb"
path = "src/lib.rs"

[dependencies]
nextgsim-common.workspace = true
nextgsim-crypto.workspace = true
nextgsim-ngap.workspace = true
nextgsim-rrc.workspace = true
nextgsim-rls.workspace = true
nextgsim-rlc.workspace = true
nextgsim-gtp.workspace = true
nextgsim-sctp.workspace = true

# 6G AI-native network function crates
nextgsim-she.workspace = true
nextgsim-nwdaf.workspace = true
nextgsim-nkef.workspace = true
nextgsim-isac.workspace = true
nextgsim-agent.workspace = true
nextgsim-fl.workspace = true

log.workspace = true
tracing-log.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait = "0.1"
thiserror.workspace = true
serde_yaml.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
