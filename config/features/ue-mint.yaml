# Rel-17/18 feature test — MINT / disaster-roaming, Rel-18 (TS 23.761).
# Baseline 999-70 UE holding a secondary SUPI 999700000000002 (seeded in Mongo).
# After the primary registers, the UE initiates a simultaneous registration for
# the secondary SUPI with the disaster-roaming indication (IEI 0xA7), and the
# enterprise DNN session is established under the secondary subscription.
# Exercises:
#   UE  : "MINT task spawned", "MINT enabled:",
#         "MINT registration: including disaster-roaming indication"
#   AMF : "MINT disaster-roaming indication present"
#   UDM : "[imsi-999700000000002] Handle NUDM UECM AMF registration"
supi:
  supi_type: Imsi
  value: "999700000000001"

protection_scheme: 0
home_network_public_key_id: 0
home_network_public_key: []
routing_indicator: "0000"

hplmn:
  mcc: 999
  mnc: 70
  long_mnc: false

key: [0x46, 0x5B, 0x5C, 0xE8, 0xB1, 0x99, 0xB4, 0x9F, 0xAA, 0x5F, 0x0A, 0x2E, 0xE2, 0x38, 0xA6, 0xBC]
op: [0xE8, 0xED, 0x28, 0x9D, 0xEB, 0xA9, 0x52, 0xE4, 0x28, 0x3B, 0x54, 0xE8, 0x8E, 0x6D, 0x83, 0x4D]
op_type: Opc
amf: [0x80, 0x00]
imei: "356938035643803"
imei_sv: null

supported_algs:
  nia1: true
  nia2: true
  nia3: true
  nea1: true
  nea2: true
  nea3: true

gnb_search_list:
  - "172.23.0.100"

sessions:
  - type: Ipv4
    s_nssai:
      sst: 1
      sd: null
    apn: "internet"
    is_emergency: false
  # enterprise DNN → routed to the secondary subscription (SUPI-2)
  - type: Ipv4
    s_nssai:
      sst: 1
      sd: null
    apn: "enterprise"
    is_emergency: false

configured_nssai:
  slices:
    - sst: 1
      sd: null

tun_name: "uesimtun0"

redcap: false

# --- Feature under test: MINT multi-SUPI / disaster roaming ---
mint_config:
  enabled: true
  secondary_supis:
    - "999700000000002"
  active_subscription: 0
  simultaneous_registration: true
  disaster_roaming: true
  dnn_subscription_map:
    - dnn: "enterprise"
      subscription_index: 1
