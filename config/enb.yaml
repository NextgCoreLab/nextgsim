# nextgsim LTE eNB configuration (nextgsim #186).
# PLMN 999-70 and TAC 1 match nextgcore's docker/rust/configs/epc/mme.yaml.

# eNB ID, interpreted per enb_id_type: macro (20 bits, default), home (28),
# short_macro (18) or long_macro (21) -- TS 36.413 §9.2.1.37.
enb_id: 0x19B
enb_id_type: macro

plmn:
  mcc: 999
  mnc: 70
  long_mnc: false

# Primary TAC (16 bits). With supported_tas omitted the eNB advertises this TAC
# broadcasting `plmn`.
tac: 1
# supported_tas:
#   - tac: 1
#     broadcast_plmns: [{ mcc: 999, mnc: 70, long_mnc: false }]

enb_name: nextgsim-enb
paging_drx: v128

mme_configs:
  - address: 172.24.0.5
    port: 36412

# Local S1-MME address.
s1ap_ip: 172.24.0.50

# Re-initiation delay when S1 SETUP FAILURE carries no Time To Wait, and the
# response timer (TS 36.413 defines neither).
s1_setup_retry_secs: 10
s1_setup_response_timeout_ms: 5000

# The E-UTRA cell and its RLS radio endpoint (nextgsim #186 increment 2). RLS
# replaces PHY/MAC; RRC (TS 36.331) and SRB1 PDCP (TS 36.323) run over it.
radio:
  link_ip: 172.24.0.50
  rls_port: 4997
  # Low bits of the E-UTRAN Cell Identity under the macro eNB ID (8 bits here).
  cell_id: 1
  freq_band: 7
  dl_bandwidth: n50
  q_rx_lev_min_dbm: -140
  t300_ms: 1000
  si_broadcast_period_ms: 160

# AS security algorithm preference, most preferred first (TS 33.401 §7.2.4.2.1);
# the eNB picks the first the UE supports. EIA0 is refused (§5.1.4.1).
security:
  integrity: [2, 1]
  ciphering: [2, 1, 0]

# The eNB's S1-U address named in INITIAL CONTEXT SETUP RESPONSE; default s1ap_ip.
# gtp_ip: 172.24.0.50
