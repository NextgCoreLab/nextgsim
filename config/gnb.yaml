# gNB Configuration for NextGSim
# Connects to NextGCore 5G Core Network
#
# Network: PLMN 999-70 (matches nextgcore AMF configuration)
# AMF Address: 172.23.0.5:38412 (nextgcore-amf container on nextgcore-5gc network)
# UPF Address: 172.23.0.7:2152 (nextgcore-upf container)

# NR Cell Identity (36-bit value)
# Format: gNB-ID (upper bits) + Cell-ID (lower bits)
# With gnb_id_length=32, gNB-ID is 32 bits, Cell-ID is 4 bits
nci: 0x000000010

# gNB ID length in bits (22-32)
gnb_id_length: 32

# PLMN - Must match nextgcore AMF configuration
plmn:
  mcc: 999
  mnc: 70
  long_mnc: false

# Tracking Area Code (24-bit) - Must match nextgcore AMF TAI
tac: 1

# Network Slice Selection Assistance Information
# Must match nextgcore AMF plmn_support configuration
nssai:
  - sst: 1
    sd: null  # No SD specified (default slice)

# AMF Configuration - Points to nextgcore AMF
amf_configs:
  - address: 172.23.0.5
    port: 38412

# NGAP SCTP transport backend (optional, default: userspace)
#   userspace - in-process sctp-proto over UDP. Interoperates with the
#               nextgcore simulator AMF, but NOT a real AMF (wire is UDP).
#   kernel    - real kernel SCTP (IP proto 132) via lksctp/libsctp; required
#               to associate with a real / Open5GS AMF. Only effective on a
#               Linux build compiled with `--features kernel-sctp`; otherwise
#               the connection fails loud at runtime.
sctp_backend: userspace

# IP addresses for gNB interfaces
# These should be on the Docker network that can reach nextgcore

# RLS link layer IP (for UE-gNB simulated radio link)
link_ip: 172.23.0.100

# NGAP interface IP (for AMF communication via SCTP)
ngap_ip: 172.23.0.100

# GTP-U interface IP (for user plane to UPF)
gtp_ip: 172.23.0.100

# Advertised GTP IP (for NAT scenarios, optional)
# gtp_advertise_ip: null

# Whether to ignore SCTP stream IDs (for compatibility)
ignore_stream_ids: false

# UPF Address for GTP-U data plane forwarding
# If not set, gNB uses loopback mode (for testing without real UPF)
upf_addr: 172.23.0.7
upf_port: 2152

# Rel-18 5G-Advanced features
energy_saving_enabled: false  # Cell sleep modes and energy efficiency (Rel-18)

# Rel-20 6G AI-native network function features
# All disabled by default; enable for 6G research deployments
she_enabled: false              # Service Hosting Environment - edge inference (Rel-20)
nwdaf_enabled: false            # Network Data Analytics Function (Rel-20)
nkef_enabled: false             # Network Knowledge Exposure Function (Rel-20)
isac_enabled: false             # Integrated Sensing and Communication (Rel-20)
agent_enabled: false            # AI Agent Framework (Rel-20)
federated_learning_enabled: false  # Federated Learning Aggregator (Rel-20)
