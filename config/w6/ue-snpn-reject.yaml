# W6 feature test — SNPN reject, Rel-17 (TS 23.501 §5.30).
# UE carries a bogus NID 00000000000; gNB broadcasts that NID so the UE camps
# (gnb-snpn-reject.yaml), but the AMF is started with
# AMF_SNPN_ALLOWED_NIDS=7AB01234567, so the NID fails validation and the AMF
# returns Registration Reject (5GMM cause #75). Exercises:
#   UE  : "SNPN registration: including NID=00000000000"
#   AMF : "SNPN registration rejected: NID=00000000000 not in allowed list"
supi:
  supi_type: Imsi
  value: "999700000000001"

protection_scheme: 0
home_network_public_key_id: 0
home_network_public_key: []
routing_indicator: "0000"

hplmn:
  mcc: 999
  mnc: 70
  long_mnc: false

key: [0x46, 0x5B, 0x5C, 0xE8, 0xB1, 0x99, 0xB4, 0x9F, 0xAA, 0x5F, 0x0A, 0x2E, 0xE2, 0x38, 0xA6, 0xBC]
op: [0xE8, 0xED, 0x28, 0x9D, 0xEB, 0xA9, 0x52, 0xE4, 0x28, 0x3B, 0x54, 0xE8, 0x8E, 0x6D, 0x83, 0x4D]
op_type: Opc
amf: [0x80, 0x00]
imei: "356938035643803"
imei_sv: null

supported_algs:
  nia1: true
  nia2: true
  nia3: true
  nea1: true
  nea2: true
  nea3: true

gnb_search_list:
  - "172.23.0.100"

sessions:
  - type: Ipv4
    s_nssai:
      sst: 1
      sd: null
    apn: "internet"
    is_emergency: false

configured_nssai:
  slices:
    - sst: 1
      sd: null

tun_name: "uesimtun0"

redcap: false

# --- W6 feature under test: SNPN with a NID NOT in the AMF allowed list ---
snpn_config:
  nid: "00000000000"
  cag_ids: []
  onboarding_enabled: false
