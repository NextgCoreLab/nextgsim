# W6 feature test — UAV geofence ALLOW, Rel-18 (TS 23.256).
# Aerial UE reporting altitude 100 m, inside the AMF default geofence ceiling
# (120 m). Registration includes the UAV indication (IEI 0xA8); after security
# the UE sends a UAV tracking report (0x6A) that the AMF allows. Exercises:
#   UE  : "UAV registration: including aerial-UE indication (CAA-ID=FAA-N12345)"
#   UE  : "UAV tracking report: CAA-ID=FAA-N12345"
#   AMF : "UAV registration: aerial UE authorized (CAA-ID=FAA-N12345)"
#   AMF : "[UAV Tracking] Geofence ALLOW: UAV FAA-N12345"
supi:
  supi_type: Imsi
  value: "999700000000001"

protection_scheme: 0
home_network_public_key_id: 0
home_network_public_key: []
routing_indicator: "0000"

hplmn:
  mcc: 999
  mnc: 70
  long_mnc: false

key: [0x46, 0x5B, 0x5C, 0xE8, 0xB1, 0x99, 0xB4, 0x9F, 0xAA, 0x5F, 0x0A, 0x2E, 0xE2, 0x38, 0xA6, 0xBC]
op: [0xE8, 0xED, 0x28, 0x9D, 0xEB, 0xA9, 0x52, 0xE4, 0x28, 0x3B, 0x54, 0xE8, 0x8E, 0x6D, 0x83, 0x4D]
op_type: Opc
amf: [0x80, 0x00]
imei: "356938035643803"
imei_sv: null

supported_algs:
  nia1: true
  nia2: true
  nia3: true
  nea1: true
  nea2: true
  nea3: true

gnb_search_list:
  - "172.23.0.100"

sessions:
  - type: Ipv4
    s_nssai:
      sst: 1
      sd: null
    apn: "internet"
    is_emergency: false

configured_nssai:
  slices:
    - sst: 1
      sd: null

tun_name: "uesimtun0"

redcap: false

# --- W6 feature under test: aerial UE, in-zone altitude (allow) ---
uav_config:
  is_aerial_ue: true
  uav_id: "FAA-N12345"
  uss_address: null
  max_altitude_meters: 100.0
  remote_id_enabled: true
  c2_link_required: false
