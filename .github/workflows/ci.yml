name: CI

on:
  push:
    # `first_implementation` was dropped here (#206): that branch NO LONGER EXISTS
    # -- `git ls-remote --heads` lists 26 branches and it is not among them. Its
    # rename is what broke nextgcore's cross-repo checkout, which had to move to
    # `ref: main` with a comment recording the rot. A trigger on a dead branch
    # fires for nothing and reads as coverage.
    branches: [main]
  pull_request:
    branches: [main]
  # Heavy Docker image/E2E jobs recompile both workspaces in a container and need
  # a cross-repo checkout, so they stay off the per-PR path. They run NIGHTLY
  # (schedule, below) and on demand via the Actions tab "Run workflow". The fast
  # gate (check/test/clippy/fmt) runs on every push/PR to `main`.
  #
  # NIGHTLY rather than dispatch-only (#206). Until this change this repo had NO
  # schedule at all and no interop test of any kind, so a commit here that broke
  # the N2 interface was caught only by NEXTGCORE's nightly -- up to 24 hours
  # later, reported against a nextgcore commit that did not cause it. Wrong repo,
  # wrong commit, wrong person. The 2026-09-27 run is the evidence: four of the
  # five links in nextgcore #403's blocker chain were defects in THIS repo
  # (#197/#198, #199/#200, #201/#202, #203/#204), each surfacing as a nextgcore
  # blocker. Same reasoning as nextgcore's own schedule (its #349): a cross-repo
  # E2E that runs only when someone remembers to press a button gates nothing
  # while reading as covered.
  #
  # 05:00 rather than nextgcore's 04:00, deliberately: this job checks out
  # nextgcore `main`, so running after its nightly means testing a nextgcore
  # commit that has itself just been validated, instead of racing it.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      nextgcore_ref:
        # #456: the demo-n2ho job builds its 5GC images from a PINNED nextgcore
        # commit (NEXTGCORE_DEMO_REF in that job), not main, so a demo result
        # names the image pair it ran. A dispatch may point it at a branch or sha.
        description: "nextgcore ref for EVERY demo job (demo-n2ho, demo-d446a, demo-d440a-m0) at once; empty: each job's own pinned NEXTGCORE_DEMO_REF"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace

  all-features:
    name: Check (all features)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every feature-gated job below builds a chosen set of crates with a chosen
      # set of features. None of them compiles EVERY target with EVERY feature,
      # so a test target behind a feature nobody lists rots unseen: the 6G
      # integration tests stopped compiling in September, and the sidelink tests
      # stopped compiling once a cfg-gated field was added to UeTaskBase (#319).
      # This job compiles the whole workspace, all targets, all features at once,
      # including the gNB's `kernel-sctp` arm, which no other job builds (#311).
      #
      # It is a compile gate, not a test run. Some features are mutually
      # exclusive at run time: the drb-pdcp end-to-end test asserts a bare PDCP
      # header, which `up-security` and `sdap-dataplane` deliberately change. The
      # feature jobs below run the tests in the combinations that are meaningful.
      - name: cargo check --all-features
        run: cargo check --workspace --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    # The job used to die mid-compile with "The runner has received a shutdown
    # signal" / exit 143. That was the runner running out of memory (#278).
    # `cargo test` compiles each generated-codec crate twice, once as the lib and
    # once as its unit-test binary, and runs the two rustc processes concurrently.
    # nextgsim-rrc's 5.5 MB generated rrc.rs costs about 9.7 GB per rustc with
    # full debuginfo, and nextgsim-lte-rrc about 4.5 GB. The workspace build
    # peaked at 17.7 GB summed RSS, on a runner with 16 GB of RAM and 3 GB of
    # swap. The two fixes below are measured in #278. Both are needed.
    # A healthy run finishes in about 10 minutes. 60 minutes turns a swap-thrash
    # into a clear timeout instead of a 6-hour hang.
    timeout-minutes: 60
    env:
      # No DWARF for CI test builds. This cuts rrc's rustc peak from 9.7 GB to
      # 7.6 GB, and the workspace peak to about 14 GB. Panic messages keep their
      # file:line, because that comes from `Location`, not debuginfo, and
      # RUST_BACKTRACE frames keep their function names. Local builds are
      # unaffected: this is an env override for this job only.
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Add swap headroom
        # About 14 GB is still too close to 16 GB, and the peak depends on how
        # the rrc / lte-rrc lib and test units happen to overlap. The 12 GB of
        # extra swap only absorbs that overlap; it is not paged through in
        # steady state. On ubuntu-24.04, /mnt is on the root disk (145 GB, about
        # 86 GB free at job start), so this uses disk the build never needs.
        run: |
          set -eu
          nproc; free -m; swapon --show; df -h / /mnt
          sudo fallocate -l 12G /mnt/ci-swapfile
          sudo chmod 600 /mnt/ci-swapfile
          sudo mkswap /mnt/ci-swapfile
          sudo swapon /mnt/ci-swapfile
          free -m
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        # A background sampler records peak used RAM and swap, so a future
        # regression shows up as a number in the log before it shows up as a
        # dead runner.
        run: |
          ( while sleep 2; do
              awk '/^MemTotal/{t=$2} /^MemAvailable/{a=$2} /^SwapTotal/{st=$2} /^SwapFree/{sf=$2}
                   END{printf "%d %d\n", (t-a)/1024, (st-sf)/1024}' /proc/meminfo
            done > "$RUNNER_TEMP/mem.log" ) &
          cargo test --workspace
      - name: Peak memory
        if: always()
        run: |
          echo "peak used RAM (MB): $(sort -n  -k1 "$RUNNER_TEMP/mem.log" | tail -1 | cut -d' ' -f1)"
          echo "peak used swap (MB): $(sort -n -k2 "$RUNNER_TEMP/mem.log" | tail -1 | cut -d' ' -f2)"
          df -h / /mnt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        # Pre-existing codebase has many style lints from Rust 1.95.
        # Gate on errors only; warnings are reported but don't fail CI
        # until the long tail is cleaned up incrementally.
        run: cargo clippy --workspace
      - name: cargo clippy (warnings are errors in the crates that are clean)
        # The ratchet for the step above: a crate listed here lints clean with
        # `-D warnings` and CI keeps it that way. Add a crate once it is clean;
        # still on the long tail: agent, ai, crypto, fl, gnb, nas, ue.
        # `--no-deps` lints the named crates only, so a dependency still on the
        # long tail does not fail them. nextgsim-common is the shared config
        # crate every binary links; a neg_cmp_op_on_partial_ord there went
        # unnoticed because the step above does not fail on warnings.
        run: |
          cargo clippy --no-deps --all-targets \
            -p nextgsim-cli -p nextgsim-common -p nextgsim-demo -p nextgsim-enb -p nextgsim-eps-nas \
            -p nextgsim-gtp -p nextgsim-isac -p nextgsim-lte-rrc -p nextgsim-lte-ue \
            -p nextgsim-ngap -p nextgsim-nkef -p nextgsim-nwdaf -p nextgsim-pdcp \
            -p nextgsim-rlc -p nextgsim-rls -p nextgsim-rrc \
            -p nextgsim-s1ap -p nextgsim-sctp -p nextgsim-semantic -p nextgsim-she \
            -p nextgsim-integration-tests -- -D warnings
          cargo clippy -p nextgsim-common --no-deps --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check

  sbi-client:
    # nextgsim-sbi-client (#457): its h2c stub tests, strict clippy, and the
    # default-build check. A default gNB / UE build (with or without 6g) must
    # pull in no HTTP/2 stack; the `sbi-client` arm is the positive control,
    # so the grep cannot pass vacuously.
    name: SBI client (feature-gated)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test -p nextgsim-sbi-client
      - name: cargo clippy
        run: cargo clippy -p nextgsim-sbi-client --no-deps --all-targets --features roundtrip -- -D warnings
      - name: A default gNB / UE build has no h2 or hyper
        run: |
          set -euo pipefail
          # Each crate's default, then its 6G set (gNB: the 6g umbrella; UE: the
          # optional 6G crates it forwards).
          for arm in "nextgsim-gnb:" "nextgsim-gnb:6g" "nextgsim-ue:" \
                     "nextgsim-ue:nextgsim-she,nextgsim-nwdaf,nextgsim-nkef,nextgsim-isac,nextgsim-agent,nextgsim-fl,nextgsim-semantic"; do
            c=${arm%%:*}; f=${arm#*:}
            tree=$(cargo tree -p "$c" -e normal ${f:+--features "$f"} --prefix none)
            if grep -E '^(h2|hyper|nextgsim-sbi-client) ' <<<"$tree"; then
              echo "::error::$c ${f:-default} pulls in an HTTP/2 stack; it must stay behind the sbi-client feature"; exit 1
            fi
          done
          for c in nextgsim-gnb nextgsim-ue; do
            cargo tree -p "$c" -e normal --features sbi-client --prefix none | grep -qE '^h2 ' \
              || { echo "::error::$c --features sbi-client shows no h2: the check above is vacuous"; exit 1; }
          done

  release-images:
    # nextgcore #420: release.yml publishes exactly docker/release-images.json.
    # A new binary, Dockerfile or deployed image that is not in that list (or
    # in its `excluded` list, with a reason) fails here, on the PR that adds
    # it, rather than shipping a release without it.
    name: Release image list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Every image the repo defines is published
        run: docker/check-release-images.sh

  demo-guard:
    # The demo toggle convention (#458, #461): shipped k8s manifests, compose
    # files and configs carry no `demo:` block and name no demo-only path; a
    # demo runs only from its own overlay (k8s/overlays/demo*/,
    # docker/docker-compose.demo*.yml, config/demo*/). Same rules as
    # nextgcore's deploy/check_no_demo_block.py (#1394). The nextgsim-demo
    # crate's tests run in the Test job.
    name: Demo guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The guard catches planted blocks (self-test)
        run: python3 scripts/check_no_demo_block.py --self-test
      - name: pyyaml for the render pass
        run: python3 -c 'import yaml' 2>/dev/null || pip install pyyaml
      - name: The guard catches one block per shape planted in the real tree
        # Block-style, flow-style, one-line JSON, a shipped file naming a
        # demo-only path, and a rendered ConfigMap with a root demo key: each
        # must fail. The script's trap restores the tree whatever happens.
        run: scripts/check_no_demo_block_plants.sh
      - name: No demo block in shipped manifests, compose files or configs
        # Text and reference rules over the tracked tree, plus the render pass
        # over what kustomize actually ships.
        run: |
          kubectl kustomize k8s > /tmp/k8s-render.yaml
          python3 scripts/check_no_demo_block.py --render /tmp/k8s-render.yaml

  demo-harness:
    # #456: the demo check library (scripts/demo/lib.sh) and the revert harness
    # (scripts/demo/revert-run.sh) are tested on every PR, without docker: the
    # ordered-log assertion, the no-published-port check, seeding, every
    # revert-run exit path (including a TERM mid-check, which must leave the tree
    # restored), and that every committed revert patch still applies. The real
    # stack runs in the nightly demo-n2ho job.
    name: Demo check harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x scripts/demo/*.sh
      - name: Harness self-test
        run: scripts/demo/test-harness.sh
      - name: The self-test left the tree clean
        run: |
          git diff --quiet HEAD -- || { git status --short; exit 1; }
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }

  event-bus:
    name: Event bus (feature-gated)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The `event-bus` feature (issue #16) is off by default, so the
      # default-feature check/test/clippy jobs above never compile it. Without
      # this job the module and its wiring would ship untested -- the failure mode
      # this repo has recorded for feature-gated code more than once.
      #
      # The gNB's ISAC and NWDAF tasks live behind `6g`, so the reference
      # producer/consumer path needs both features together.
      - name: cargo test (bus core)
        run: cargo test -p nextgsim-common --features event-bus
      - name: cargo test (gNB reference path)
        run: cargo test -p nextgsim-gnb --features event-bus,6g
      - name: cargo test (UE wiring)
        run: cargo test -p nextgsim-ue --features event-bus
      - name: cargo clippy
        run: |
          cargo clippy -p nextgsim-common --features event-bus --all-targets
          cargo clippy -p nextgsim-gnb --features event-bus,6g --all-targets
          cargo clippy -p nextgsim-ue --features event-bus --all-targets

  model-registry:
    name: Model registry (feature-gated)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The `model-registry` feature (issue #17) is off by default, so the
      # default-feature jobs above never compile it -- the same gap the event-bus
      # job closes. Both consumers are covered, since the sharing they get is the
      # whole point of the registry.
      - name: cargo test (registry core)
        run: cargo test -p nextgsim-ai --features model-registry
      - name: cargo test (consumers)
        run: |
          cargo test -p nextgsim-nwdaf --features model-registry
          cargo test -p nextgsim-semantic --features model-registry
      # The gNB's `model-registry` (#463, demo d440b-model-verify): the
      # refusal, fallback, demo-off and runtime-switch arms, which need no ONNX
      # Runtime. The golden-vector arms run in model-verify below.
      - name: cargo test (gNB, d440b)
        run: cargo test -p nextgsim-gnb --features 6g,model-registry
      - name: cargo clippy
        run: |
          cargo clippy -p nextgsim-ai --features model-registry --all-targets
          cargo clippy -p nextgsim-nwdaf --features model-registry --all-targets
          cargo clippy -p nextgsim-semantic --features model-registry --all-targets
          cargo clippy -p nextgsim-gnb --features 6g,model-registry --all-targets

  model-verify:
    # nextgsim#463: verified model loading against a pinned ONNX Runtime. The
    # tests that need the runtime (the golden vectors, "model verified", the
    # served-by-onnx counters) are #[ignore]d everywhere else and run here with
    # --include-ignored; each FAILS rather than skips without ORT_DYLIB_PATH.
    # The golden vectors are valid only on this pinned runtime.
    name: Model verify (pinned ONNX Runtime)
    runs-on: ubuntu-latest
    needs: check
    env:
      ORT_VERSION: 1.23.2
      # sha256 of onnxruntime-linux-x64-1.23.2.tgz, from the GitHub release
      # asset's digest. A different tarball fails the job before any test.
      ORT_SHA256: 1fa4dcaef22f6f7d5cd81b28c2800414350c10116f5fdd46a2160082551c5f9b
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The committed model artefacts are what the generator writes
        run: python3 -I tools/d440b-model/make_reference_model.py --check
      - name: Fetch and verify the pinned ONNX Runtime
        run: |
          set -euo pipefail
          tgz="onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          curl -fsSL --retry 3 -o "/tmp/${tgz}" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${tgz}"
          echo "${ORT_SHA256}  /tmp/${tgz}" | sha256sum -c -
          mkdir -p /tmp/ort
          tar -xzf "/tmp/${tgz}" -C /tmp/ort --strip-components=1
          lib="/tmp/ort/lib/libonnxruntime.so.${ORT_VERSION}"
          test -f "${lib}"
          echo "ORT_DYLIB_PATH=${lib}" >> "$GITHUB_ENV"
      - name: cargo test, the runtime arms included
        run: |
          set -euo pipefail
          # --lib: --include-ignored would also run the crates' `ignore`d
          # doctests, which are illustrative and do not compile.
          cargo test -p nextgsim-ai --features model-registry --lib -- --include-ignored
          cargo test -p nextgsim-nwdaf --features model-registry --lib -- --include-ignored
          cargo test -p nextgsim-gnb --features 6g,model-registry --lib d440b -- --include-ignored
      - name: The runtime arms really ran (not filtered or skipped)
        run: |
          set -euo pipefail
          out=$(cargo test -p nextgsim-gnb --features 6g,model-registry --lib d440b::ort -- --include-ignored 2>&1)
          echo "${out}" | tail -5
          echo "${out}" | grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed'
      - name: A default gNB build pulls no ONNX Runtime crate
        run: |
          set -euo pipefail
          if cargo tree -p nextgsim-gnb -e normal --prefix none | grep -E '^ort(-sys)? '; then
            echo "::error::the default gNB build depends on ort"; exit 1
          fi
      - name: A 6G build without model-registry needs no ONNX Runtime
        # The acceptance arm: unset the runtime and the 6G gNB still passes.
        run: env -u ORT_DYLIB_PATH cargo test -p nextgsim-gnb --features 6g --lib nwdaf

  uuaa-mm:
    name: UUAA-MM (feature-gated)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The `uuaa-mm` feature (issue #58) is off by default, so the
      # default-feature jobs above compile the UE with UUAA uplink initiation
      # disabled. This job compiles and tests the enabled arm -- the one that
      # puts a Service-level-AA container on the wire.
      - name: cargo test (uuaa-mm on)
        run: cargo test -p nextgsim-ue --features uuaa-mm
      - name: cargo clippy
        run: cargo clippy -p nextgsim-ue --features uuaa-mm --all-targets

  sixg:
    name: 6G crates (feature-gated)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The gNB's 6G surface -- NWDAF, ISAC, SHE, NKEF, agent -- lives behind
      # the `6g` umbrella, so the default-feature jobs above compile none of it.
      # It is not entirely uncovered: the event-bus job tests it in the
      # `event-bus,6g` COMBINATION. This job covers `6g` on its own, which is the
      # combination an operator actually enables, and keeps that coverage from
      # depending on the event-bus job continuing to exist. Issue #18's work
      # (nwdaf/task.rs and the rls/task.rs forwarding) lands here.
      - name: cargo test (6g alone)
        run: |
          cargo test -p nextgsim-gnb --features 6g
          cargo test -p nextgsim-ue --features 6g
      # The 6G end-to-end tests (tests/src/sixg_task_integration.rs) only compile
      # under the integration crate's `6g` feature. No job built them, so they
      # stopped compiling in September and nobody saw it (#319).
      # Demo d447a-nkef-live (#488): the NKEF live tees, SBA client and bundle
      # are behind `nkef-sba`, which no other job enables.
      - name: cargo test (6g + nkef-sba)
        run: cargo test -p nextgsim-gnb --features 6g,nkef-sba
      # Demo d441a-congestion-loop (#465): the downlink queue at C, the OLS
      # predictor and the cell-report exporter are behind their own feature.
      - name: cargo test (demo-d441a-congestion-loop)
        run: cargo test -p nextgsim-gnb --features demo-d441a-congestion-loop
      # Demo d444a-ambr-adapt (#477): the UE's Session-AMBR-following stream and
      # the semantic-sink binary are behind `demo-d444a-ambr-adapt`.
      - name: cargo test (6g + demo-d444a-ambr-adapt)
        run: |
          cargo test -p nextgsim-ue --features 6g,demo-d444a-ambr-adapt
          cargo test -p nextgsim-semantic --features demo-d444a-ambr-adapt
      # Demo d440a-ai-paging (#462): the D440A registration, its paging grid
      # startup line and their tests are behind `demo-d440a-ai-paging`.
      - name: cargo test (demo-d440a-ai-paging)
        run: cargo test -p nextgsim-gnb --features demo-d440a-ai-paging
      # Demo d441d-predictive-ho (#467): the predictor tick, the shadow A3
      # evaluator, the A3-in-shadow gate and the seeded replay are behind
      # `demo-d441d-predictive-ho`; the conflict with D446A needs both features.
      - name: cargo test (demo-d441d-predictive-ho)
        run: |
          cargo test -p nextgsim-gnb --features demo-d441d-predictive-ho
          cargo test -p nextgsim-gnb --features demo-d441d-predictive-ho,demo-d446a-agent-conflict --lib d441d_with_d446a
          cargo test -p nextgsim-integration-tests --features demo-d441d-predictive-ho --test d441d_a3_replica
      # Demo d440c-nwdaf-paging (#464): the gNB's PAGING assistance log, its
      # registration and their tests are behind `demo-d440c-nwdaf-paging`.
      - name: cargo test (demo-d440c-nwdaf-paging)
        run: cargo test -p nextgsim-gnb --features demo-d440c-nwdaf-paging
      - name: D444A revert arms (each patch must fail its named test)
        run: scripts/demo/d444a-reverts.sh
      # Demo d445a-fl-t8 (#480): the nr-fl-server AF (FL listener, NEF client,
      # T8 callback listener) and the UE FL client are behind
      # `demo-d445a-fl-t8`; the revert knobs (--no-t8, --freeze-global,
      # fl.leak_raw) behind `revert-hooks`. The AF tests run it end to end over
      # loopback against a stub nefd over h2c.
      - name: cargo test (demo-d445a-fl-t8)
        run: |
          cargo test -p nextgsim-fl --features demo-d445a-fl-t8
          cargo test -p nextgsim-fl --features revert-hooks
          cargo test -p nextgsim-ue --features demo-d445a-fl-t8
          cargo test -p nextgsim-ue --features revert-hooks --lib fl_participant
      # The T8 listener's churn smoke tests flood loopback, so they are
      # #[ignore]d in the suites above and run here on their own, serially.
      - name: D445A T8 listener churn smoke tests (serial)
        run: >-
          cargo test -p nextgsim-fl --features demo-d445a-fl-t8 --lib churning
          -- --ignored --test-threads=1
      - name: D445A revert arms (each patch must fail its named test)
        run: D445A_SMOKE=0 scripts/demo/d445a-reverts.sh
      - name: cargo test (6g end to end)
        run: cargo test -p nextgsim-integration-tests --features 6g
      - name: cargo clippy
        run: |
          cargo clippy -p nextgsim-gnb --features 6g --all-targets
          cargo clippy -p nextgsim-gnb --features 6g,nkef-sba --all-targets
          cargo clippy -p nextgsim-gnb --features demo-d440a-ai-paging --all-targets
          cargo clippy -p nextgsim-gnb --features demo-d440c-nwdaf-paging --all-targets
          cargo clippy -p nextgsim-gnb --features demo-d441a-congestion-loop --all-targets
          cargo clippy -p nextgsim-gnb --features demo-d441d-predictive-ho --all-targets
          cargo clippy -p nextgsim-ue --features 6g --all-targets
          cargo clippy -p nextgsim-ue --features 6g,demo-d444a-ambr-adapt --all-targets
          cargo clippy -p nextgsim-semantic --features demo-d444a-ambr-adapt --all-targets
          cargo clippy -p nextgsim-fl --features revert-hooks --all-targets
          cargo clippy -p nextgsim-ue --features demo-d445a-fl-t8 --all-targets
          cargo clippy -p nextgsim-integration-tests --features 6g --all-targets

  drb-pdcp:
    name: DRB PDCP (feature-gated)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The `drb-pdcp` feature (issue #33) is off by default because it interposes
      # a sublayer on the live user-plane data path, so the default-feature jobs
      # above compile the paths WITHOUT it. This job covers the enabled arm,
      # including the end-to-end test that only compiles under the feature -- and
      # it must run both ends together, since a gNB with PDCP and a UE without
      # would have the UE read a PDCP header as payload.
      - name: cargo test (entity)
        run: cargo test -p nextgsim-pdcp
      - name: cargo test (both ends)
        run: |
          cargo test -p nextgsim-gnb --features drb-pdcp
          cargo test -p nextgsim-ue --features drb-pdcp
      - name: cargo test (end to end)
        run: cargo test -p nextgsim-integration-tests --features drb-pdcp
      - name: cargo clippy
        run: |
          cargo clippy -p nextgsim-pdcp --all-targets
          cargo clippy -p nextgsim-gnb --features drb-pdcp --all-targets
          cargo clippy -p nextgsim-ue --features drb-pdcp --all-targets

  lte-enb-kernel-sctp:
    name: LTE eNB kernel SCTP (feature-gated)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # S1-MME is real SCTP (TS 36.412 §7), so the eNB's production transport is
      # the kernel backend, which needs libsctp at link time and is therefore off
      # in the default jobs above. This job compiles and lints that arm so it
      # cannot rot unseen (#186). The cross-repo interop test against nextgcore's
      # mmed stays `#[ignore]`: it needs an mmed binary, see its module docs.
      - name: install libsctp
        run: sudo apt-get update && sudo apt-get install -y libsctp-dev
      - name: cargo test
        run: cargo test -p nextgsim-enb --features kernel-sctp
      # The kernel backend itself (non-blocking connect, #311) and the gNB's
      # kernel-sctp arm, which no other job tests.
      - name: cargo test (kernel backend and gNB)
        run: |
          cargo test -p nextgsim-sctp --features kernel-sctp
          cargo test -p nextgsim-gnb --features kernel-sctp sctp::
      - name: cargo clippy
        run: |
          cargo clippy -p nextgsim-enb --features kernel-sctp --all-targets
          cargo clippy -p nextgsim-gnb --features kernel-sctp --all-targets

  up-security:
    name: UP security (feature-gated)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The `up-security` feature (issue #32) is off by default and implies
      # `drb-pdcp`: without a PDCP entity there is no COUNT for ciphering and
      # integrity to be keyed on. Both ends must be built the same way -- a gNB
      # that protects against a UE that does not takes the user plane down rather
      # than degrading it -- so this job builds and tests them together, including
      # the end-to-end test that only compiles under the feature.
      #
      # `nextgsim-pdcp` needs no feature: the shared `UpSecurity` layer and its
      # tests are always compiled, and only the wiring on each endpoint is gated.
      - name: cargo test (shared layer)
        run: cargo test -p nextgsim-pdcp
      - name: cargo test (both ends)
        run: |
          cargo test -p nextgsim-gnb --features up-security
          cargo test -p nextgsim-ue --features up-security
      - name: cargo test (end to end)
        run: cargo test -p nextgsim-integration-tests --features up-security
      - name: cargo clippy
        run: |
          cargo clippy -p nextgsim-gnb --features up-security --all-targets
          cargo clippy -p nextgsim-ue --features up-security --all-targets
          cargo clippy -p nextgsim-integration-tests --features up-security --all-targets

  sdap-dataplane:
    name: SDAP data plane (feature-gated)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The `sdap-dataplane` feature (issue #44) is off by default because it
      # interposes a sublayer on the live user-plane data path -- the same reason
      # `drb-pdcp` and `up-security` are gated, one octet earlier in the stack. So
      # the default-feature jobs above compile those paths WITHOUT it, and without
      # this job the enabled arm would ship with CI never having built it, which is
      # the recorded failure mode for feature-gated code here (issues #33, #139).
      #
      # Both ends together, never one alone: a gNB that prepends a one-octet SDAP
      # header to a UE that does not strip it has the UE read the header as the
      # first octet of its IP packet. There is no configuration in which enabling
      # one side is useful, so there is none worth testing.
      - name: cargo test (the shared header codec and the mapping policy)
        run: |
          cargo test -p nextgsim-pdcp sdap
          cargo test -p nextgsim-gtp qfi_drb
      - name: cargo test (both ends)
        run: |
          cargo test -p nextgsim-gnb --features sdap-dataplane
          cargo test -p nextgsim-ue --features sdap-dataplane
      - name: cargo test (end to end)
        run: cargo test -p nextgsim-integration-tests --features sdap-dataplane
      # The feature also has to compose with the sublayers it sits above: SDAP
      # prepends its header BEFORE PDCP takes the SDU, so a mistake in that order is
      # invisible until all three are on together.
      - name: cargo test (with PDCP and user-plane security beneath it)
        run: |
          cargo test -p nextgsim-gnb --features sdap-dataplane,up-security
          cargo test -p nextgsim-ue --features sdap-dataplane,up-security
          cargo test -p nextgsim-integration-tests --features sdap-dataplane,up-security
      - name: cargo clippy
        run: |
          cargo clippy -p nextgsim-gnb --features sdap-dataplane --all-targets
          cargo clippy -p nextgsim-ue --features sdap-dataplane --all-targets
          cargo clippy -p nextgsim-integration-tests --features sdap-dataplane --all-targets

  sidelink:
    name: Sidelink facade (feature-gated)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The `sidelink` feature (issue #54) is off by default, and unlike the
      # other feature jobs here it gates code that used to be UNCONDITIONAL.
      # That inverts the usual risk: it is the ENABLED arm the default jobs above
      # never compile, so without this job the whole sidelink and prose surface --
      # the PC5 state machine, the positioning engine, ~20 existing tests --
      # would silently stop being built by CI the moment it was gated. Both
      # modules are on one feature because `prose.rs` uses
      # `sidelink::Pc5RrcState`.
      - name: cargo test (sidelink on)
        run: cargo test -p nextgsim-ue --features sidelink
      - name: cargo clippy
        run: cargo clippy -p nextgsim-ue --features sidelink --all-targets

  as-security:
    name: AS security (config-gated)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # AS security (issue #31) is a CONFIG switch, not a cargo feature, so the
      # default jobs above DO compile every line of it -- unlike the feature jobs
      # here. What they do not do is EXERCISE the activated arm: the tests that set
      # `as_security_enabled: true` run under `cargo test --workspace` already, so
      # this job exists for the layer they all rest on.
      #
      # `nextgsim-pdcp`'s `srb_security` is where the MAC-and-cipher layout lives,
      # and it is the one thing both the gNB and the UE must agree on byte for byte.
      # Running it on its own, plus both endpoints' security modules, makes a
      # divergence fail here with a small blast radius rather than inside a
      # whole-workspace run.
      - name: cargo test (the shared SRB PDCP layer)
        run: cargo test -p nextgsim-pdcp srb_security
      - name: cargo test (both endpoints' AS security)
        run: |
          cargo test -p nextgsim-ue security
          cargo test -p nextgsim-gnb as_security
      - name: cargo clippy
        run: cargo clippy -p nextgsim-pdcp --all-targets

  ranging:
    name: Sidelink ranging (feature-gated)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The ranging pipeline sits behind BOTH the `sidelink` cargo feature (the
      # SL-PRS stimulus and the positioning engine live in the module #54 gated off)
      # and `ranging_config.enabled` at run time. So the default jobs above compile
      # none of it and reach none of it -- the recorded failure mode for
      # feature-gated code is shipping without CI ever compiling it (issue #139).
      - name: cargo test (the ranging end-to-end)
        run: cargo test -p nextgsim-integration-tests --features sidelink --test ranging_report_e2e
      - name: cargo test (both ends of the pipeline)
        run: |
          cargo test -p nextgsim-ue --features sidelink ranging
          cargo test -p nextgsim-ue --features sidelink nas::lpp
      - name: cargo clippy
        run: |
          cargo clippy -p nextgsim-integration-tests --features sidelink --all-targets
          cargo clippy -p nextgsim-ue --features sidelink --all-targets

  sidelink-pc5:
    name: Sidelink PC5 procedures (feature-gated)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The real PC5 procedures (issue #141): the PC5-S Direct Communication handshake,
      # Model A/B direct discovery, UE-to-UE relay forwarding and the RRC
      # `SidelinkUEInformation` resource request. All of it sits behind the `sidelink`
      # cargo feature #54 gated off, so the default jobs above compile none of it -- the
      # recorded failure mode for feature-gated code here is shipping an enabled arm CI
      # never built (issues #33, #139).
      #
      # Distinct from `sidelink-facade` and `sidelink-ranging` above: those cover the
      # module's honesty wording and the SL-PRS/ranging pipeline respectively. This one
      # covers the PC5 procedures and the end-to-end chains.
      #
      # Issue #190 added the L2 UE-to-Network relay to this job: the TS 38.351 SRAP
      # sublayer, the `sl-L2RelayUE-Config` RRC half, and the remote-UE-to-network E2E.
      # The SRAP sublayer itself is in `nextgsim-rlc`, which is NOT feature-gated -- so
      # `cargo test --workspace` already builds and runs it -- but it is named here too
      # because the only thing that drives it is this gated arm.
      - name: cargo test (the PC5 and UE-to-Network relay end-to-end chains)
        run: cargo test -p nextgsim-integration-tests --features sidelink --test sidelink_pc5_e2e
      - name: cargo test (the PC5-S codec, link state machine, discovery and relay)
        run: |
          cargo test -p nextgsim-ue --features sidelink sidelink::
          cargo test -p nextgsim-rrc sidelink_ue_information
      - name: cargo test (the SRAP adaptation layer, TS 38.351)
        run: |
          cargo test -p nextgsim-rlc srap
          cargo test -p nextgsim-rrc sidelink_relay_config
      - name: cargo test (the gNB's answer to a resource request, and its relay grant)
        run: cargo test -p nextgsim-gnb rrc::sidelink
      - name: cargo clippy
        run: |
          cargo clippy -p nextgsim-integration-tests --features sidelink --all-targets
          cargo clippy -p nextgsim-ue --features sidelink --all-targets
          cargo clippy -p nextgsim-rlc --all-targets

  pqc:
    name: Post-quantum crypto (feature-gated)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The `pqc` feature (issue #22) is off by default because 3GPP has frozen no
      # normative PQC specification, so no procedure calls ML-KEM or ML-DSA and
      # enabling them would pull two pre-1.0 release-candidate crates into every
      # default build of the workspace. So the default jobs above compile NONE of
      # `pqc_kem`, `pqc_sign` or `hybrid` -- and unlike the other features here,
      # this one gates code that used to be UNCONDITIONAL, which inverts the risk
      # exactly as `sidelink` does: without this job the whole post-quantum
      # surface, its 29 existing tests AND the new FIPS 203/204 known-answer tests
      # would silently stop being built the moment the gate landed. That is the
      # recorded failure mode for feature-gated code in this repo (issues #33, #139).
      #
      # The KATs are the point of the job, not a side effect: they are the only
      # tests that hold our byte encodings to NIST ACVP rather than to themselves,
      # and they are the reason `ml-kem`'s `deterministic` feature is a hard
      # requirement of `pqc` (see nextgsim-crypto/Cargo.toml).
      - name: cargo test (the whole post-quantum surface)
        run: cargo test -p nextgsim-crypto --features pqc
      - name: cargo test (the FIPS 203/204 known-answer tests specifically)
        # Named separately so a KAT regression is legible in the job log rather
        # than buried among ~200 crypto tests. `kat_` is the naming convention for
        # every vector-backed test in the three modules.
        run: cargo test -p nextgsim-crypto --features pqc kat_
      # The feature must also come OFF cleanly: `nextgsim-crypto` is a dependency
      # of the NAS, PDCP, RRC, gNB and UE crates, so a stray unguarded `use` of a
      # gated module would break the default build of half the workspace. The
      # default `check` job covers that, and this makes the negative arm explicit
      # for the crate itself.
      - name: cargo test (default features, no PQC)
        run: cargo test -p nextgsim-crypto
      - name: cargo clippy
        run: |
          cargo clippy -p nextgsim-crypto --features pqc --all-targets
          cargo clippy -p nextgsim-crypto --all-targets

  docker-build:
    name: Docker Build
    # Nightly OR on demand (#206). A disjunction, not a replacement: the dispatch
    # path is unchanged.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Rust binaries
        # The Dockerfile.{gnb,ue,enb,lte-ue}-local images expect ./binaries/nr-gnb,
        # nr-ue, lte-enb and lte-ue to exist (binaries are NOT tracked in git — see
        # nextgcore DECISIONS.md). Build them here before the docker build.
        #
        # lte-enb needs kernel SCTP for S1-MME (TS 36.412 §7) and refuses to start
        # without it, so it is built with the feature and libsctp-dev installed
        # (#186 increment 5).
        run: |
          sudo apt-get update && sudo apt-get install -y libsctp-dev
          cargo build --release --bin nr-gnb --bin nr-ue
          cargo build --release -p nextgsim-enb --features kernel-sctp --bin lte-enb
          cargo build --release -p nextgsim-lte-ue --bin lte-ue
          mkdir -p binaries
          cp target/release/nr-gnb binaries/
          cp target/release/nr-ue binaries/
          cp target/release/lte-enb binaries/
          cp target/release/lte-ue binaries/

      # #448: a nightly failed in `Build gNB image` on `failed to resolve source
      # metadata for docker.io/library/debian:bookworm-slim@sha256:...: TLS
      # handshake timeout` -- one Docker Hub blip, no second chance. The
      # registry round trip is moved HERE, where it is retried (5 attempts,
      # 5/10/20/40s backoff): every base the four Dockerfiles build FROM is
      # pulled into the daemon's image store, and a digest-pinned base then
      # resolves locally, so the builds below do not contact Docker Hub for it.
      # The builds themselves are NOT retried: a genuine build error still fails
      # its step on the first attempt. A pull that fails all five times fails
      # this step.
      - name: Pre-pull the base images (retried)
        run: |
          set -euo pipefail
          docker/pull-base-images.sh Dockerfile.gnb-local Dockerfile.ue-local \
            Dockerfile.enb-local Dockerfile.lte-ue-local

      - name: Build gNB image
        run: |
          docker build -f Dockerfile.gnb-local -t nextgsim/nr-gnb:latest .

      - name: Build UE image
        run: |
          docker build -f Dockerfile.ue-local -t nextgsim/nr-ue:latest .

      - name: Build LTE eNB image
        run: |
          docker build -f Dockerfile.enb-local -t nextgsim/lte-enb:latest .

      - name: Build LTE UE image
        run: |
          docker build -f Dockerfile.lte-ue-local -t nextgsim/lte-ue:latest .

      # ASSERTS, rather than printing (#206, the same defect nextgcore #421 fixed
      # in its own image loop). This step used to be `docker images | grep
      # nextgsim` with no assertion at all -- a listing a human was expected to
      # read, which gates nothing. `docker image inspect` is the check because it
      # FAILS on a missing image, where a grep would match a substring of a
      # neighbouring tag.
      - name: Verify every expected image exists
        run: |
          set -euo pipefail
          missing=""
          for image in nextgsim/nr-gnb:latest nextgsim/nr-ue:latest \
                       nextgsim/lte-enb:latest nextgsim/lte-ue:latest; do
            if ! docker image inspect "$image" >/dev/null 2>&1; then
              missing="${missing} ${image}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::MISSING IMAGES:${missing}"
            docker images | grep nextgsim || true
            exit 1
          fi
          echo "All expected images present (nr-gnb, nr-ue, lte-enb, lte-ue)."
          docker images | grep nextgsim

  # ====================================================================
  # #206: the INTEROP nightly. Does THIS repo's HEAD still register a UE
  # against nextgcore?
  #
  # WHY IT EXISTS. Until this job, a commit here that broke the N2 interface was
  # caught only by NEXTGCORE's nightly -- up to 24 hours later, reported against
  # a nextgcore commit that did not cause it. The 2026-09-27 run is the evidence:
  # four of the five links in nextgcore #403's blocker chain were defects in this
  # repo, each surfacing as a nextgcore blocker.
  #
  # WHY IT IS MINIMAL, AND WHAT THAT COSTS. nextgcore's `docker-e2e` is ~893
  # lines with ~75 references to nextgcore-local things (its compose files, its
  # 172.23.0.0/24 core network, `namf_event_probe`, `Dockerfile.builder`).
  # Copying that here would be two copies of one procedure drifting -- the defect
  # shape of this repo's own #197/#198, where two CliServer implementations
  # drifted to incompatible wire versions 3.2.7 and 1.0.0. So this job asserts
  # only the RAN-side contract that is this repo's responsibility:
  #
  #   * the gNB completes NG Setup with the AMF (N2 is up), and
  #   * the UE receives a Registration Accept (NAS registration completes).
  #
  # DELIBERATELY NOT COPIED, and therefore NOT covered here: the Namf
  # event-delivery probes, the Service Request CM-IDLE cycle (#403), the OAuth2
  # overlay, and the EPC stage. Those live in nextgcore's nightly and are its to
  # assert -- they are about the CORE's behaviour, not the RAN's. A reader must
  # not take this job's green as covering them.
  #
  # ASSERTIONS ARE POSITIVE and read the EXACT log lines this repo emits:
  # `nextgsim-gnb/src/ngap/task.rs:700` and
  # `nextgsim-ue/src/nas/mm/orchestrator.rs:1675`. Both were grepped out of the
  # source rather than paraphrased -- a paraphrase makes the check silently
  # unfalsifiable, and nextgcore #187's history is the precedent: its first CI
  # assertion grepped for a string that was absent because ZERO requests had been
  # made, so it passed by vacuity.
  # ====================================================================
  interop-e2e:
    name: Interop E2E (registers a real UE against nextgcore)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: test
    env:
      # nextgcore's docker-compose.yml fails fast without it (nextgcore #837): no
      # Grafana credential is committed. A per-run throwaway value, the same one
      # nextgcore's own docker-e2e job sets; Grafana is not started here.
      GRAFANA_ADMIN_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout nextgsim
        uses: actions/checkout@v4
        with:
          path: nextgsim

      # nextgcore `main`, tracked rather than pinned -- for the same reason
      # nextgcore tracks this repo's main: a pinned ref is what rotted when this
      # repo renamed its default branch. The sha actually used is recorded below
      # so a failure names the pair.
      - name: Checkout nextgcore
        uses: actions/checkout@v4
        with:
          repository: NextgCoreLab/nextgcore
          ref: main
          path: nextgcore

      - name: Record the pair under test
        run: |
          set -euo pipefail
          sim=$(git -C nextgsim rev-parse HEAD)
          core=$(git -C nextgcore rev-parse HEAD)
          echo "### Interop pair" >> "$GITHUB_STEP_SUMMARY"
          echo "| repo | commit |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| nextgsim (this repo, HEAD) | \`${sim}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| nextgcore (main) | \`${core}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "nextgsim=${sim} nextgcore=${core}"

      # nextgcore's builder compiles BOTH workspaces, including this repo's nr-gnb
      # and nr-ue out of the sibling checkout. Reused rather than re-implemented:
      # the build context is the parent of both trees, which is why the checkouts
      # above use sibling paths.
      - name: Build both workspaces via nextgcore's builder
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker build -f Dockerfile.builder -t nextg-builder ../../../
          cd ../..
          docker create --name builder nextg-builder /bin/true
          mkdir -p docker/rust/binaries
          docker cp builder:/out/. docker/rust/binaries/
          docker rm builder
          # The RAN binaries are this job's whole point, so their absence is a
          # hard failure here rather than a puzzling compose error later.
          test -f docker/rust/binaries/nr-gnb && test -f docker/rust/binaries/nr-ue && test -f docker/rust/binaries/nr-cli \
            || { echo "::error::nr-gnb or nr-ue missing from the builder output -- this \
                 repo's binaries did not compile. Check the builder log."; \
                 ls -la docker/rust/binaries/; exit 1; }

      - name: Build the 5GC images this test needs
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker build -f Dockerfile.core -t nextgcore-core:latest .
          # Only the NFs a registration touches, not all 24: this job is the RAN
          # contract, and every extra image is build minutes that assert nothing
          # about it.
          # nwdafd for the nextgsim-sbi-client round trip (#457).
          for nf in amfd ausfd bsfd nrfd nssfd nwdafd pcfd smfd udmd udrd upfd; do
            docker build -f Dockerfile.nf \
              --build-arg CORE_IMAGE=nextgcore-core:latest \
              --build-arg NF_NAME=nextgcore-${nf} \
              -t nextgcore-rust/${nf%%d}:latest .
          done

      - name: Build this repo's gNB and UE images
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          mkdir -p ../../../nextgsim/binaries
          cp binaries/nr-gnb binaries/nr-ue ../../../nextgsim/binaries/
          docker build -f ../../../nextgsim/Dockerfile.gnb-local \
            -t nextgsim-gnb:latest ../../../nextgsim
          docker build -f ../../../nextgsim/Dockerfile.ue-local \
            -t nextgsim-ue:latest ../../../nextgsim

      - name: Start the 5GC
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker compose up -d mongodb nrf
          sleep 5
          docker compose up -d ausf udm udr pcf nssf bsf
          sleep 5
          docker compose up -d amf smf upf
          sleep 10
          docker compose ps

      # THE GATE. Two positive assertions, each on the exact text this repo emits.
      #
      # `docker compose logs` is captured to a FILE and the file is grepped, never
      # piped into `grep -q`: under pipefail, grep -q exits on the first match,
      # docker logs dies with SIGPIPE, and the pipeline reports failure -- turning
      # a real match into a false negative. nextgcore's e2e-test.sh records the
      # same rule.
      - name: Register a real UE through this repo's gNB over N2
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker compose up -d gnb ue
          # NG Setup first: the gNB must associate and be accepted before any UE
          # NAS can cross N2, so failing here is a RAN-transport problem and is
          # worth distinguishing from a NAS failure below.
          for _ in $(seq 1 60); do
            docker compose logs gnb > /tmp/gnb.log 2>&1 || true
            if grep -qF 'Received NG Setup Response' /tmp/gnb.log; then break; fi
            sleep 2
          done
          grep -F 'Received NG Setup Response' /tmp/gnb.log \
            || { echo "::error::this repo's gNB never completed NG Setup with the AMF, so \
                 no UE could register. N2 is down."; \
                 tail -60 /tmp/gnb.log; docker compose logs --tail=60 amf; exit 1; }
          echo "NG Setup complete."
          # Then the NAS registration itself.
          for _ in $(seq 1 60); do
            docker compose logs ue > /tmp/ue.log 2>&1 || true
            if grep -qF 'Received Registration Accept' /tmp/ue.log; then break; fi
            sleep 2
          done
          grep -F 'Received Registration Accept' /tmp/ue.log \
            || { echo "::error::the UE never received a Registration Accept. NG Setup \
                 succeeded, so N2 transport is up and this is a NAS-layer failure."; \
                 tail -80 /tmp/ue.log; docker compose logs --tail=80 amf; exit 1; }
          echo "UE registered. This repo's RAN still interoperates with nextgcore."

      - name: Release the UE to CM-IDLE and bring it back with a Service Request (#252)
        # A Service Request sent from 5GMM-IDLE is an initial NAS message: integrity
        # protected, NOT ciphered, non-cleartext IEs in the NAS message container
        # (TS 24.501 §4.4.6 b), §5.6.1.2.1). Before #252 this UE ciphered the whole
        # message, hiding the 5G-S-TMSI, and amfd logged "Unhandled NAS message type"
        # for it. Asserted at the signalling level only: user-plane re-activation and
        # network-triggered paging are blocked on nextgcore #540.
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          for _ in $(seq 1 60); do
            docker compose logs ue > /tmp/ue.log 2>&1 || true
            if grep -qF 'is now ACTIVE' /tmp/ue.log; then break; fi
            sleep 2
          done
          grep -F 'is now ACTIVE' /tmp/ue.log \
            || { echo "::error::no PDU session, so no TUN to originate uplink data on"; \
                 tail -60 /tmp/ue.log; exit 1; }
          # nr-cli must run inside the gNB container (its CLI server binds 127.0.0.1).
          docker cp binaries/nr-cli nextgsim-gnb:/tmp/nr-cli
          docker compose exec -T --user root gnb chmod 0755 /tmp/nr-cli
          UE_ID=$(docker compose exec -T gnb /tmp/nr-cli gnb --exec 'ue-list' \
                  | grep -oE 'ue_id: [0-9]+' | head -1 | grep -oE '[0-9]+')
          test -n "$UE_ID" || { echo "::error::the gNB listed no UE context"; exit 1; }
          docker compose exec -T gnb /tmp/nr-cli gnb --exec "ue-release ${UE_ID}"
          for _ in $(seq 1 30); do
            docker compose logs ue > /tmp/ue.log 2>&1 || true
            if grep -qF 'Received RRC Release' /tmp/ue.log; then break; fi
            sleep 1
          done
          grep -F 'Received RRC Release' /tmp/ue.log \
            || { echo "::error::the UE never received RRCRelease, so it is not CM-IDLE"; \
                 tail -60 /tmp/ue.log; exit 1; }
          # Uplink data from CM-IDLE triggers the Service Request (TS 24.501 §5.6.1.1).
          # The ping may lose packets while the Service Request runs, hence
          # `|| true`; the interface itself must exist, or the ping sends
          # nothing and the check below fails for the wrong reason (#432).
          docker compose exec -T ue ip link show uesimtun0 >/dev/null \
            || { echo "::error::the UE has no uesimtun0 (tun_name is a prefix, #432)"; \
                 docker compose exec -T ue ip -o link show; exit 1; }
          docker compose exec -T ue ping -I uesimtun0 -c 3 -W 3 10.45.0.1 || true
          for _ in $(seq 1 30); do
            docker compose logs amf > /tmp/amf.log 2>&1 || true
            if grep -qF 'Service Request from CM-IDLE' /tmp/amf.log; then break; fi
            sleep 1
          done
          grep -F 'Service Request from CM-IDLE' /tmp/amf.log \
            || { echo "::error::the AMF never accepted the idle-mode Service Request"; \
                 grep -iE 'service|unhandled' /tmp/amf.log | tail -20; exit 1; }
          docker compose logs ue > /tmp/ue.log 2>&1 || true
          grep -F 'Service Accept received' /tmp/ue.log \
            || { echo "::error::the UE never received the Service Accept"; \
                 tail -60 /tmp/ue.log; exit 1; }
          echo "Idle-mode Service Request accepted by nextgcore."

      - name: Build the SBI client round trip (#457)
        # On the runner, then run in ubuntu:24.04 (the runner's own OS, so the
        # same glibc) on the compose network. No port is published.
        working-directory: nextgsim
        run: cargo build --release -p nextgsim-sbi-client --features roundtrip --bin sbi-roundtrip

      - name: SBI client round trip through the real NRF and nwdafd (#457)
        # nextgsim-sbi-client over h2c: register at the NRF, discover NWDAF,
        # GET Nnwdaf_AnalyticsInfo NF_LOAD (2xx), deregister. It registers as AF
        # (TS 29.520 §4.3.1.3.2). Since nextgcore#1412 (#1416) nwdafd's
        # allowedNfTypes lists AF, so the NRF returns the NWDAF to an AF
        # requester: no NWDAF_URI fallback is passed, and discovery must find it.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker compose up -d nwdaf
          for _ in $(seq 1 30); do
            docker compose logs nwdaf 2>&1 | grep -qF 'NWDAF registered with NRF' && break
            sleep 2
          done
          net=$(docker inspect nextgcore-nrf -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          docker run --rm --network "$net" \
            -v "$GITHUB_WORKSPACE/nextgsim/target/release/sbi-roundtrip:/usr/local/bin/sbi-roundtrip:ro" \
            -e NRF_URI=http://172.23.0.10:7777 \
            ubuntu:24.04 /usr/local/bin/sbi-roundtrip | tee /tmp/sbi-plain.txt
          ../../../nextgsim/scripts/assert-ordered.sh /tmp/sbi-plain.txt \
            'ROUNDTRIP nrf-register status=20' \
            'ROUNDTRIP nrf-discover status=200 nwdaf-instances=1' \
            'ROUNDTRIP nwdaf-analytics status=20' \
            'ROUNDTRIP nrf-deregister status=20' \
            'ROUNDTRIP OK mode=plain'

      - name: SBI client round trip under the OAuth2 profile (#457)
        # nrf and nwdaf recreated with docker-compose.oauth2.yml. A tokenless
        # call must get 401 from nwdafd. The client publishes its CCA key to the
        # NRF's trusted-keys volume and asks for a token. Since nextgcore#1412
        # (#1416) the NRF grants an AF the nnwdaf-analyticsinfo scope (TS 29.520
        # §4.3.1.3.2), so the AF arm expects the grant and the analytics call;
        # before it, the NRF answered unauthorized_client and the client failed
        # closed (EXPECT_TOKEN=refused:<error> still exercises that path).
        # Last step on purpose: the other NFs are not recreated with tokens.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker compose -f docker-compose.yml -f docker-compose.oauth2.yml \
            up -d --force-recreate --no-deps nrf nwdaf
          for _ in $(seq 1 30); do
            docker compose logs nwdaf 2>&1 | grep -qF 'OAuth2 enforcement enabled' && \
              docker compose logs nwdaf 2>&1 | grep -qF 'NWDAF registered with NRF' && break
            sleep 2
          done
          net=$(docker inspect nextgcore-nrf -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          vol=$(docker inspect nextgcore-nrf -f '{{range .Mounts}}{{if eq .Destination "/etc/nextgcore/cca-public"}}{{.Name}}{{end}}{{end}}')
          test -n "$vol" || { echo "::error::the NRF has no cca-public volume; is the overlay applied?"; exit 1; }
          docker run --rm --network "$net" -v "$vol:/cca-public" \
            -v "$GITHUB_WORKSPACE/nextgsim/target/release/sbi-roundtrip:/usr/local/bin/sbi-roundtrip:ro" \
            -e MODE=oauth2 -e CCA_PUBLIC_JWK_DIR=/cca-public -e EXPECT_TOKEN=granted \
            -e NRF_URI=http://172.23.0.10:7777 \
            ubuntu:24.04 /usr/local/bin/sbi-roundtrip | tee /tmp/sbi-oauth2.txt
          ../../../nextgsim/scripts/assert-ordered.sh /tmp/sbi-oauth2.txt \
            'ROUNDTRIP nrf-register status=20' \
            'ROUNDTRIP nrf-discover status=200 nwdaf-instances=1' \
            'ROUNDTRIP tokenless status=401 (expected)' \
            'ROUNDTRIP token granted target=NWDAF scope=nnwdaf-analyticsinfo' \
            'ROUNDTRIP nwdaf-analytics status=20' \
            'ROUNDTRIP OK mode=oauth2'
          # The same granted path for a NEF, the type nwdafd allowed before
          # #1412 too: a second consumer type through the same real NRF.
          docker run --rm --network "$net" -v "$vol:/cca-public" \
            -v "$GITHUB_WORKSPACE/nextgsim/target/release/sbi-roundtrip:/usr/local/bin/sbi-roundtrip:ro" \
            -e MODE=oauth2 -e CCA_PUBLIC_JWK_DIR=/cca-public -e EXPECT_TOKEN=granted \
            -e NF_TYPE=NEF -e NF_INSTANCE_ID=6b1d7e3c-0000-4000-8000-00000000457e \
            -e CCA_KEY_FILE=/tmp/nef-cca.key \
            -e NRF_URI=http://172.23.0.10:7777 \
            ubuntu:24.04 /usr/local/bin/sbi-roundtrip | tee /tmp/sbi-oauth2-granted.txt
          ../../../nextgsim/scripts/assert-ordered.sh /tmp/sbi-oauth2-granted.txt \
            'ROUNDTRIP nrf-register status=20' \
            'ROUNDTRIP nrf-discover status=200 nwdaf-instances=1' \
            'ROUNDTRIP tokenless status=401 (expected)' \
            'ROUNDTRIP token granted target=NWDAF scope=nnwdaf-analyticsinfo' \
            'ROUNDTRIP nwdaf-analytics status=20' \
            'ROUNDTRIP OK mode=oauth2'

          # Fail closed against the REAL NRF: a CHF is not a TS 29.520
          # §4.3.1.3.2 consumer, so the NRF hides the NWDAF from it
          # (nwdaf-instances=0, hence the NWDAF_URI fallback here only) and
          # refuses it the scope with unauthorized_client; the client must then
          # make no tokenless call. The other half of #1416, beside the grants.
          docker run --rm --network "$net" -v "$vol:/cca-public" \
            -v "$GITHUB_WORKSPACE/nextgsim/target/release/sbi-roundtrip:/usr/local/bin/sbi-roundtrip:ro" \
            -e MODE=oauth2 -e CCA_PUBLIC_JWK_DIR=/cca-public -e EXPECT_TOKEN=refused:unauthorized_client \
            -e NF_TYPE=CHF -e NF_INSTANCE_ID=6b1d7e3c-0000-4000-8000-00000000c4f0 \
            -e CCA_KEY_FILE=/tmp/chf-cca.key \
            -e NRF_URI=http://172.23.0.10:7777 -e NWDAF_URI=http://172.23.0.30:7777 \
            ubuntu:24.04 /usr/local/bin/sbi-roundtrip | tee /tmp/sbi-oauth2-refused.txt
          ../../../nextgsim/scripts/assert-ordered.sh /tmp/sbi-oauth2-refused.txt \
            'ROUNDTRIP nrf-register status=20' \
            'ROUNDTRIP nrf-discover status=200 nwdaf-instances=0' \
            'ROUNDTRIP tokenless status=401 (expected)' \
            'ROUNDTRIP token refused status=400 error=unauthorized_client (expected); failed closed' \
            'ROUNDTRIP OK mode=oauth2'

      - name: Collect logs on failure
        if: failure()
        run: |
          cd nextgcore/docker/rust
          docker compose logs --tail=100 nrf || true
          docker compose logs --tail=100 nwdaf || true
          docker compose logs --tail=100 amf || true
          docker compose logs --tail=100 gnb || true
          docker compose logs --tail=100 ue || true

      - name: Teardown
        if: always()
        run: |
          cd nextgcore/docker/rust
          docker compose down -v || true

  # ====================================================================
  # #460: the LIVE 6G nightly. A 6G-featured gNB and UE run against nextgcore.
  #
  # The `sixg` job above tests the 6G tasks in process. This one runs the real
  # binaries, built with `--features 6g` on both nodes and started with the 6G
  # config flags on, through registration and a PDU session. It then asserts the
  # 6G message paths the enabler issues made live:
  #
  #   * RLS -> gNB NWDAF cell load (#452). Before #452 the RLS task held
  #     `sixg: None` and never sent one, so this line is the revert check.
  #   * RLS heartbeat -> gNB NWDAF UE measurement, recorded with RSRP only (#453).
  #   * UE RRC cycle -> UE NWDAF reporter, and RLS -> gNB Agent observation
  #     (#459).
  #
  # The DEFAULT-build nightly (`interop-e2e` above) is untouched. This job builds
  # its own images under the same local tags, in its own runner, and publishes
  # nothing. The 6G flags are switched on in this runner's checkout of
  # `config/`, so no shipped config changes. Nothing listens beyond the compose
  # network, and no port is published.
  #
  # The asserted strings are the exact text the code emits, grepped from the
  # source:
  #   nextgsim-gnb/src/wiring.rs             "NWDAF task spawned", "Agent task spawned"
  #   nextgsim-gnb/src/nwdaf/task.rs         "NWDAF: Cell ", " load - occupancy="
  #                                          "NWDAF: UE ", " measurement - RSRP="
  #   nextgsim-gnb/src/agent/task.rs         "Agent: first cell observation"
  #   nextgsim-ue/src/nwdaf_reporter/task.rs "NWDAF Reporter: first serving-cell measurement"
  # ====================================================================
  sixg-live-e2e:
    name: 6G live E2E (6G-featured gNB and UE against nextgcore)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: test
    env:
      GRAFANA_ADMIN_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout nextgsim
        uses: actions/checkout@v4
        with:
          path: nextgsim

      - name: Checkout nextgcore
        uses: actions/checkout@v4
        with:
          repository: NextgCoreLab/nextgcore
          ref: main
          path: nextgcore

      - name: Record the pair under test
        run: |
          set -euo pipefail
          sim=$(git -C nextgsim rev-parse HEAD)
          core=$(git -C nextgcore rev-parse HEAD)
          echo "### 6G live pair" >> "$GITHUB_STEP_SUMMARY"
          echo "| repo | commit |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| nextgsim (this repo, HEAD, \`--features 6g\`) | \`${sim}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| nextgcore (main) | \`${core}\` |" >> "$GITHUB_STEP_SUMMARY"

      # The 5GC binaries come from nextgcore's builder, exactly as in
      # interop-e2e. Its nr-gnb/nr-ue are default builds, so they are replaced
      # below.
      - name: Build the 5GC via nextgcore's builder
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker build -f Dockerfile.builder -t nextg-builder ../../../
          cd ../..
          docker create --name builder nextg-builder /bin/true
          mkdir -p docker/rust/binaries
          docker cp builder:/out/. docker/rust/binaries/
          docker rm builder

      # Built inside the same pinned toolchain image nextgcore's builder uses
      # (bookworm glibc, matching the bookworm-slim runtime images), with the
      # 6G umbrella on BOTH nodes.
      - name: Build the 6G-featured gNB and UE
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE/nextgsim:/src" -w /src \
            -e CARGO_TARGET_DIR=/src/target-6g \
            rust:1.95.0-bookworm@sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1 \
            cargo build --release --locked -p nextgsim-gnb -p nextgsim-ue \
              --features nextgsim-gnb/6g,nextgsim-ue/6g --bin nr-gnb --bin nr-ue
          mkdir -p nextgsim/binaries
          cp nextgsim/target-6g/release/nr-gnb nextgsim/target-6g/release/nr-ue nextgsim/binaries/

      - name: Build the 5GC images and the 6G gNB/UE images (not published)
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker build -f Dockerfile.core -t nextgcore-core:latest .
          for nf in amfd ausfd bsfd nrfd nssfd pcfd smfd udmd udrd upfd; do
            docker build -f Dockerfile.nf \
              --build-arg CORE_IMAGE=nextgcore-core:latest \
              --build-arg NF_NAME=nextgcore-${nf} \
              -t nextgcore-rust/${nf%%d}:latest .
          done
          docker build -f ../../../nextgsim/Dockerfile.gnb-local \
            -t nextgsim-gnb:latest ../../../nextgsim
          docker build -f ../../../nextgsim/Dockerfile.ue-local \
            -t nextgsim-ue:latest ../../../nextgsim

      # The compose file mounts this checkout's config/ into both containers.
      # Only this runner's copy is edited; every flag is asserted afterwards, so
      # a renamed key cannot leave the job silently testing a 5G-only run.
      - name: Turn the 6G config flags on (this runner's checkout only)
        run: |
          set -euo pipefail
          cd nextgsim/config
          for key in nwdaf_enabled agent_enabled; do
            sed -i "s/^${key}: false/${key}: true/" gnb.yaml
            grep -qE "^${key}: true" gnb.yaml || { echo "::error::gnb.yaml has no ${key}"; exit 1; }
          done
          for key in ai_ml_enabled; do
            sed -i "s/^${key}: false/${key}: true/" ue.yaml
            grep -qE "^${key}: true" ue.yaml || { echo "::error::ue.yaml has no ${key}"; exit 1; }
          done

      # Two of the asserted lines (the NWDAF cell load and UE measurement) are
      # debug!. nextgcore #1436 made the compose file ship RUST_LOG=info for the
      # gNB, which is right for a default run and leaves those lines out, so this
      # job raises only the gNB's NWDAF module for its own run. The override file
      # is the one `docker compose` loads on its own beside docker-compose.yml.
      - name: Raise the gNB NWDAF log level to debug (this runner only)
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          test ! -e docker-compose.override.yml || { echo "::error::nextgcore now ships a docker-compose.override.yml"; exit 1; }
          printf 'services:\n  gnb:\n    environment:\n      RUST_LOG: info,nextgsim_gnb::nwdaf=debug\n' > docker-compose.override.yml
          docker compose config gnb > /tmp/gnb-compose.yml
          grep -q 'RUST_LOG: info,nextgsim_gnb::nwdaf=debug' /tmp/gnb-compose.yml \
            || { echo "::error::the gNB RUST_LOG override did not apply"; cat /tmp/gnb-compose.yml; exit 1; }

      - name: Start the 5GC
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker compose up -d mongodb nrf
          sleep 5
          docker compose up -d ausf udm udr pcf nssf bsf
          sleep 5
          docker compose up -d amf smf upf
          sleep 10
          docker compose ps

      # Logs go to a file that is then grepped, never `docker logs | grep -q`:
      # under pipefail, grep -q's early exit SIGPIPEs docker logs and turns a
      # match into a failure (the rule interop-e2e records).
      - name: Register and establish a PDU session with 6G on
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker compose up -d gnb ue
          wait_for() { # <service> <fixed string> <tries>
            for _ in $(seq 1 "$3"); do
              docker compose logs "$1" > "/tmp/$1.log" 2>&1 || true
              if grep -qF "$2" "/tmp/$1.log"; then return 0; fi
              sleep 2
            done
            echo "::error::$1 never logged: $2"; tail -80 "/tmp/$1.log"; return 1
          }
          wait_for gnb 'NWDAF task spawned' 15
          wait_for gnb 'Agent task spawned' 5
          wait_for gnb 'Received NG Setup Response' 60
          wait_for ue 'Received Registration Accept' 60
          wait_for ue 'is now ACTIVE' 60
          echo "Registered with a PDU session, 6G-featured gNB and UE."

      - name: Assert the live 6G message paths
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          check() { # <service> <regex> <what>
            for _ in $(seq 1 30); do
              docker compose logs "$1" > "/tmp/$1.log" 2>&1 || true
              if grep -qE "$2" "/tmp/$1.log"; then
                echo "live: $3"; grep -E "$2" "/tmp/$1.log" | head -2; return 0
              fi
              sleep 2
            done
            echo "::error::not live: $3"; tail -80 "/tmp/$1.log"; return 1
          }
          # #452: RLS -> NWDAF. The revert check: dead while RLS held sixg: None.
          check gnb 'NWDAF: Cell -?[0-9]+ load - occupancy=' 'RLS -> gNB NWDAF cell load (#452)'
          # #453: an RSRP-only heartbeat measurement is recorded.
          check gnb 'NWDAF: UE -?[0-9]+ measurement - RSRP=' 'RLS -> gNB NWDAF UE measurement (#453)'
          # #459: the production producers.
          check gnb 'Agent: first cell observation' 'RLS -> gNB Agent observation (#459)'
          check ue 'NWDAF Reporter: first serving-cell measurement' 'UE RRC -> UE NWDAF reporter (#459)'

      - name: Collect logs on failure
        if: failure()
        run: |
          cd nextgcore/docker/rust
          docker compose logs --tail=100 amf || true
          docker compose logs --tail=150 gnb || true
          docker compose logs --tail=150 ue || true

      - name: Teardown
        if: always()
        run: |
          cd nextgcore/docker/rust
          docker compose down -v || true

  # ====================================================================
  # #456: the two-gNB N2 handover demo stack, the first demo-program nightly.
  #
  # One N2 handover across two real nextgsim gNBs against a real nextgcore:
  # nextgcore's standalone docker/rust/docker-compose.demo-n2ho.yml (gnb-west,
  # gnb-east, a UE that walks between them), driven by scripts/demo/n2ho-check.sh,
  # which asserts the ordered chain on amfd and on both gNBs (TS 23.502
  # §4.9.1.3, TS 38.413 §8.4.1-8.4.3), the UPF moving the downlink to the target,
  # and a ping through the target afterwards. amfd's N2 handover had never run
  # in any CI before this job (nextgcore ci.yml's docker-e2e: "not handover").
  #
  # PINNED nextgcore, not main: the 5GC images are built from NEXTGCORE_DEMO_REF,
  # so a demo result names the image pair it ran (recorded in the summary). A
  # dispatch's `nextgcore_ref` input overrides it. Bump the pin deliberately.
  #
  # Private: the stack publishes no port (asserted from `docker compose config`
  # before anything starts), and its bridge is internal. The default nightly
  # (interop-e2e) is untouched.
  #
  # Then the REVERT ARM: scripts/demo/revert-run.sh applies
  # reverts/n2ho-ue-never-moves.patch (the UE stays put), reruns the same check,
  # and passes only if it fails at amf step 1/6; its trap restores config/, and
  # the step after asserts the checkout is clean.
  # ====================================================================
  demo-n2ho:
    name: Demo N2 handover (two gNBs against pinned nextgcore)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # nextgcore main at #1414's merge: the first commit with docker/rust/docker-compose.demo-n2ho.yml.
      NEXTGCORE_DEMO_REF: ${{ inputs.nextgcore_ref || '9d50cb9ccb5caca31da40cf631d96c2750e1af33' }}
    steps:
      - name: Checkout nextgsim
        uses: actions/checkout@v4
        with:
          path: nextgsim

      - name: Checkout nextgcore (pinned)
        uses: actions/checkout@v4
        with:
          repository: NextgCoreLab/nextgcore
          ref: ${{ env.NEXTGCORE_DEMO_REF }}
          path: nextgcore

      - name: Record the pair under test
        run: |
          set -euo pipefail
          sim=$(git -C nextgsim rev-parse HEAD)
          core=$(git -C nextgcore rev-parse HEAD)
          {
            echo "### Demo N2 handover pair"
            echo "| repo | commit |"
            echo "|---|---|"
            echo "| nextgsim (this repo, HEAD) | \`${sim}\` |"
            echo "| nextgcore (pinned \`${NEXTGCORE_DEMO_REF}\`) | \`${core}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "nextgsim=${sim} nextgcore=${core}"

      - name: Demo harness self-test
        run: nextgsim/scripts/demo/test-harness.sh

      # The acceptance criterion, as its own step: the rendered model of the
      # stack (what `up` runs) has no published port and no host networking.
      - name: The demo stack publishes no port (docker compose config)
        run: |
          set -euo pipefail
          . nextgsim/scripts/demo/lib.sh
          export NEXTGSIM_DIR="$GITHUB_WORKSPACE/nextgsim"
          demo_compose_init nextgcore/docker/rust/docker-compose.demo-n2ho.yml
          demo_assert_private
          demo_compose config --format json | jq -r '.services | keys | join(" ")'

      - name: Build both workspaces via nextgcore's builder
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker build -f Dockerfile.builder -t nextg-builder ../../../
          cd ../..
          docker create --name builder nextg-builder /bin/true
          mkdir -p docker/rust/binaries
          docker cp builder:/out/. docker/rust/binaries/
          docker rm builder
          if [ ! -f docker/rust/binaries/nr-gnb ] || [ ! -f docker/rust/binaries/nr-ue ]; then
            echo "::error::nr-gnb or nr-ue missing from the builder output"; ls -la docker/rust/binaries/; exit 1
          fi

      - name: Build the 5GC, gNB and UE images (not published)
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker build -f Dockerfile.core -t nextgcore-core:latest .
          for nf in amfd ausfd bsfd nrfd nssfd pcfd smfd udmd udrd upfd; do
            docker build -f Dockerfile.nf \
              --build-arg CORE_IMAGE=nextgcore-core:latest \
              --build-arg NF_NAME=nextgcore-${nf} \
              -t nextgcore-rust/${nf%%d}:latest .
          done
          mkdir -p ../../../nextgsim/binaries
          cp binaries/nr-gnb binaries/nr-ue ../../../nextgsim/binaries/
          docker build -f ../../../nextgsim/Dockerfile.gnb-local \
            -t nextgsim-gnb:latest ../../../nextgsim
          docker build -f ../../../nextgsim/Dockerfile.ue-local \
            -t nextgsim-ue:latest ../../../nextgsim

      - name: N2 handover gnb-west -> gnb-east, ordered chain on amfd and both gNBs
        timeout-minutes: 15
        env:
          NEXTGCORE_DIR: ${{ github.workspace }}/nextgcore
          DEMO_ARTEFACTS: ${{ runner.temp }}/demo/handover
        run: nextgsim/scripts/demo/n2ho-check.sh

      - name: Revert arm (UE never moves -> the check fails at amf step 1/6)
        timeout-minutes: 15
        env:
          NEXTGCORE_DIR: ${{ github.workspace }}/nextgcore
          DEMO_ARTEFACTS: ${{ runner.temp }}/demo/revert-ue-never-moves
          N2HO_TIMEOUT: "90"
        run: |
          set -euo pipefail
          cd nextgsim
          scripts/demo/revert-run.sh --expect '[amf] step 1/6 missing' \
            scripts/demo/reverts/n2ho-ue-never-moves.patch -- scripts/demo/n2ho-check.sh

      - name: The revert arm left the checkout clean
        if: always()
        run: |
          set -euo pipefail
          cd nextgsim
          git diff --quiet HEAD -- || { echo "::error::tracked files differ from HEAD"; git status --short; exit 1; }
          git status --short
          echo "nextgsim checkout: no tracked change after the revert arm"

      - name: Upload the captured logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-n2ho-logs
          path: ${{ runner.temp }}/demo
          if-no-files-found: warn
          retention-days: 14

      - name: Teardown
        if: always()
        run: |
          docker compose -f nextgcore/docker/rust/docker-compose.demo-n2ho.yml down -v --remove-orphans || true

  # ====================================================================
  # Demo D446A (#483): load-balancing vs energy-saving agents over a booster
  # cell, on nextgcore's two-gNB stack (#456), scheduled and dispatch only.
  # One seeded run per mode, the demo-off arm (kill switch), the runtime-switch arm
  # (nr-cli `set` between two contests flips the second only), then the revert arms
  # (scripts/demo/d446a-reverts.sh: each patch must fail its named test). The
  # gNB is built with --features demo-d446a-agent-conflict; the default nightly
  # jobs and the demo-n2ho job are unchanged.
  # ====================================================================
  demo-d446a:
    name: Demo D446A agent conflict (two gNBs against pinned nextgcore)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # nextgcore main at #1418's merge (the amfd HandoverRequired source_gnb_id/cause and
      # HandoverFailure gnb_id log lines this demo asserts).
      NEXTGCORE_DEMO_REF: ${{ inputs.nextgcore_ref || '5a42e5fadf6d8999f6b002d6b8d8131dc22efa11' }}
    steps:
      - name: Checkout nextgsim
        uses: actions/checkout@v4
        with:
          path: nextgsim

      - name: Checkout nextgcore (pinned)
        uses: actions/checkout@v4
        with:
          repository: NextgCoreLab/nextgcore
          ref: ${{ env.NEXTGCORE_DEMO_REF }}
          path: nextgcore

      - name: Record the pair under test
        run: |
          set -euo pipefail
          {
            echo "### Demo D446A pair"
            echo "| repo | commit |"
            echo "|---|---|"
            echo "| nextgsim (this repo, HEAD) | \`$(git -C nextgsim rev-parse HEAD)\` |"
            echo "| nextgcore (pinned \`${NEXTGCORE_DEMO_REF}\`) | \`$(git -C nextgcore rev-parse HEAD)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The demo stack publishes no port (docker compose config)
        run: |
          set -euo pipefail
          . nextgsim/scripts/demo/lib.sh
          export NEXTGSIM_DIR="$GITHUB_WORKSPACE/nextgsim"
          demo_compose_init nextgcore/docker/rust/docker-compose.demo-n2ho.yml
          demo_assert_private

      - name: Build the 5GC via nextgcore's builder, the gNB with the demo feature
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker build -f Dockerfile.builder -t nextg-builder ../../../
          cd ../..
          docker create --name builder nextg-builder /bin/true
          mkdir -p docker/rust/binaries
          docker cp builder:/out/. docker/rust/binaries/
          docker rm builder
          cd ../nextgsim
          # Built in a bookworm container: the images are debian:bookworm-slim
          # (glibc 2.36), and a binary built on the runner needs GLIBC_2.38.
          docker run --rm -v "$PWD":/src -w /src -e CARGO_TARGET_DIR=/src/target rust:1-bookworm sh -c \
            'apt-get update -qq && apt-get install -y -qq libsctp-dev >/dev/null && \
             cargo build --release -p nextgsim-gnb --features demo-d446a-agent-conflict -p nextgsim-cli'
          # The container ran as root: hand target/ back to the runner user, or
          # the revert arms' host cargo cannot create target/debug.
          sudo chown -R "$(id -u):$(id -g)" target
          mkdir -p binaries
          cp target/release/nr-gnb target/release/nr-cli binaries/
          cp ../nextgcore/docker/rust/binaries/nr-ue binaries/

      - name: Build the 5GC, gNB and UE images (not published)
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker build -f Dockerfile.core -t nextgcore-core:latest .
          for nf in amfd ausfd bsfd nrfd nssfd pcfd smfd udmd udrd upfd; do
            docker build -f Dockerfile.nf \
              --build-arg CORE_IMAGE=nextgcore-core:latest \
              --build-arg NF_NAME=nextgcore-${nf} \
              -t nextgcore-rust/${nf%%d}:latest .
          done
          docker build -f ../../../nextgsim/Dockerfile.gnb-local -t nextgsim-gnb:latest ../../../nextgsim
          docker build -f ../../../nextgsim/Dockerfile.ue-local -t nextgsim-ue:latest ../../../nextgsim

      - name: Main arm (mode load-balancing)
        timeout-minutes: 15
        env:
          NEXTGCORE_DIR: ${{ github.workspace }}/nextgcore
          DEMO_ARTEFACTS: ${{ runner.temp }}/demo
        run: nextgsim/scripts/demo/d446a-check.sh load-balancing

      - name: Swap arm (mode energy-saving)
        timeout-minutes: 15
        env:
          NEXTGCORE_DIR: ${{ github.workspace }}/nextgcore
          DEMO_ARTEFACTS: ${{ runner.temp }}/demo
        run: nextgsim/scripts/demo/d446a-check.sh energy-saving

      - name: Demo off (kill switch)
        timeout-minutes: 15
        env:
          NEXTGCORE_DIR: ${{ github.workspace }}/nextgcore
          DEMO_ARTEFACTS: ${{ runner.temp }}/demo
        run: nextgsim/scripts/demo/d446a-check.sh off

      - name: Runtime switch arm (nr-cli set between two contests)
        timeout-minutes: 20
        env:
          NEXTGCORE_DIR: ${{ github.workspace }}/nextgcore
          DEMO_ARTEFACTS: ${{ runner.temp }}/demo
        run: nextgsim/scripts/demo/d446a-check.sh runtime-switch

      - name: Revert arms (each patch fails its named test)
        timeout-minutes: 60
        run: nextgsim/scripts/demo/d446a-reverts.sh

      - name: The revert arms left the checkout clean
        if: always()
        run: |
          set -euo pipefail
          cd nextgsim
          git diff --quiet HEAD -- || { echo "::error::tracked files differ from HEAD"; git status --short; exit 1; }

      - name: Upload the captured logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-d446a-logs
          path: ${{ runner.temp }}/demo
          if-no-files-found: warn
          retention-days: 14

      - name: Teardown
        if: always()
        run: |
          docker compose -f nextgcore/docker/rust/docker-compose.demo-n2ho.yml down -v --remove-orphans || true

  # ====================================================================
  # Demo D440A M0 gate (#462): before predicted paging is measured, the base
  # stack must do what it is measured on. On nextgcore's two-gNB stack (#456),
  # scripts/demo/d440a-m0-check.sh releases the UE to CM-IDLE on gnb-west, lets
  # it move idle along a sim_route (config/ue-d440a-m0.yaml), and asserts the
  # idle reselection to gnb-east (TS 38.304 §5.2.4) and a mobile-terminated
  # Service Request through gnb-east answering the AMF's PAGING (TS 23.502
  # §4.2.3.3), with the downlink pings answered.
  #
  # Arms: base (no demo block), then the revert arm (the UE has no route: the
  # check must fail at ue step 4/9), then page-all (the gNBs built with
  # --features demo-d440a-ai-paging, the demo on in its predictor-off mode, with
  # a paging grid: same chain, plus the banner and the grid). Private: the
  # merged stack publishes no port (asserted before `up`). Scheduled and
  # dispatch only; the default nightly jobs and the other demo jobs are unchanged.
  # ====================================================================
  demo-d440a-m0:
    name: Demo D440A M0 (idle reselection + MT Service Request via another gNB)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # nextgcore main at #1448's merge (amfd paging.strategy, which #462's later
      # arms use; the default strategy this gate runs is today's paging).
      NEXTGCORE_DEMO_REF: ${{ inputs.nextgcore_ref || '10c50d56e065d92ac9d762c14241bb5fef00344d' }}
    steps:
      - name: Checkout nextgsim
        uses: actions/checkout@v4
        with:
          path: nextgsim

      - name: Checkout nextgcore (pinned)
        uses: actions/checkout@v4
        with:
          repository: NextgCoreLab/nextgcore
          ref: ${{ env.NEXTGCORE_DEMO_REF }}
          path: nextgcore

      - name: Record the pair under test
        run: |
          set -euo pipefail
          {
            echo "### Demo D440A M0 pair"
            echo "| repo | commit |"
            echo "|---|---|"
            echo "| nextgsim (this repo, HEAD) | \`$(git -C nextgsim rev-parse HEAD)\` |"
            echo "| nextgcore (pinned \`${NEXTGCORE_DEMO_REF}\`) | \`$(git -C nextgcore rev-parse HEAD)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The demo stack publishes no port (docker compose config)
        run: |
          set -euo pipefail
          . nextgsim/scripts/demo/lib.sh
          export NEXTGSIM_DIR="$GITHUB_WORKSPACE/nextgsim"
          demo_compose_init nextgcore/docker/rust/docker-compose.demo-n2ho.yml \
            nextgsim/scripts/demo/d440a-m0.compose.yml nextgsim/scripts/demo/d440a-page-all.compose.yml
          demo_assert_private

      - name: Build both workspaces via nextgcore's builder
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker build -f Dockerfile.builder -t nextg-builder ../../../
          cd ../..
          docker create --name builder nextg-builder /bin/true
          mkdir -p docker/rust/binaries
          docker cp builder:/out/. docker/rust/binaries/
          docker rm builder
          for b in nr-gnb nr-ue nr-cli; do
            [ -f "docker/rust/binaries/$b" ] || { echo "::error::$b missing from the builder output"; exit 1; }
          done

      - name: Build the 5GC, gNB and UE images (not published)
        run: |
          set -euo pipefail
          cd nextgcore/docker/rust
          docker build -f Dockerfile.core -t nextgcore-core:latest .
          for nf in amfd ausfd bsfd nrfd nssfd pcfd smfd udmd udrd upfd; do
            docker build -f Dockerfile.nf \
              --build-arg CORE_IMAGE=nextgcore-core:latest \
              --build-arg NF_NAME=nextgcore-${nf} \
              -t nextgcore-rust/${nf%%d}:latest .
          done
          mkdir -p ../../../nextgsim/binaries
          cp binaries/nr-gnb binaries/nr-ue binaries/nr-cli ../../../nextgsim/binaries/
          docker build -f ../../../nextgsim/Dockerfile.gnb-local -t nextgsim-gnb:latest ../../../nextgsim
          docker build -f ../../../nextgsim/Dockerfile.ue-local -t nextgsim-ue:latest ../../../nextgsim

      - name: M0 base arm (no demo block)
        timeout-minutes: 15
        env:
          NEXTGCORE_DIR: ${{ github.workspace }}/nextgcore
          DEMO_ARTEFACTS: ${{ runner.temp }}/demo
        run: nextgsim/scripts/demo/d440a-m0-check.sh base

      - name: Revert arm (the UE has no route -> the check fails at ue step 4/9)
        timeout-minutes: 15
        env:
          NEXTGCORE_DIR: ${{ github.workspace }}/nextgcore
          DEMO_ARTEFACTS: ${{ runner.temp }}/demo/revert-ue-stays-put
          M0_TIMEOUT: "60"
        run: |
          set -euo pipefail
          cd nextgsim
          scripts/demo/revert-run.sh --expect '[ue] step 4/9 missing' \
            scripts/demo/reverts/d440a-m0-ue-stays-put.patch -- scripts/demo/d440a-m0-check.sh base

      - name: The revert arm left the checkout clean
        if: always()
        run: |
          set -euo pipefail
          cd nextgsim
          git diff --quiet HEAD -- || { echo "::error::tracked files differ from HEAD"; git status --short; exit 1; }

      - name: Build the gNB with demo-d440a-ai-paging
        run: |
          set -euo pipefail
          cd nextgsim
          # Built in a bookworm container: the images are debian:bookworm-slim
          # (glibc 2.36), and a binary built on the runner needs GLIBC_2.38.
          docker run --rm -v "$PWD":/src -w /src -e CARGO_TARGET_DIR=/src/target rust:1-bookworm sh -c \
            'apt-get update -qq && apt-get install -y -qq libsctp-dev >/dev/null && \
             cargo build --release -p nextgsim-gnb --features demo-d440a-ai-paging'
          sudo chown -R "$(id -u):$(id -g)" target
          cp target/release/nr-gnb binaries/
          docker build -f Dockerfile.gnb-local -t nextgsim-gnb:latest .

      - name: M0 page-all arm (D440A on, predictor off)
        timeout-minutes: 15
        env:
          NEXTGCORE_DIR: ${{ github.workspace }}/nextgcore
          DEMO_ARTEFACTS: ${{ runner.temp }}/demo
          NR_CLI: ${{ github.workspace }}/nextgsim/binaries/nr-cli
        run: nextgsim/scripts/demo/d440a-m0-check.sh page-all

      - name: Upload the captured logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-d440a-m0-logs
          path: ${{ runner.temp }}/demo
          if-no-files-found: warn
          retention-days: 14

      - name: Teardown
        if: always()
        run: |
          docker compose -f nextgcore/docker/rust/docker-compose.demo-n2ho.yml down -v --remove-orphans || true
