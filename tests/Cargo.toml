[package]
name = "nextgsim-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Enables the 6G AI-native integration tests (src/sixg_task_integration.rs),
# which drive the optional 6G task types re-exported only from a `--features 6g`
# build of nextgsim-gnb. Off by default so `cargo test --workspace` exercises the
# lean gNB build. Run the 6G tests with:
#   cargo test -p nextgsim-integration-tests --features 6g
6g = ["nextgsim-gnb/6g"]
# Enables the DRB PDCP end-to-end test (src/drb_pdcp_user_plane.rs), which needs
# the sublayer interposed on BOTH ends (issue #33). Forwarded to both crates
# together on purpose: a gNB with PDCP and a UE without would have the UE read a
# PDCP header as payload, so there is no configuration in which enabling one is
# useful.
drb-pdcp = ["nextgsim-gnb/drb-pdcp", "nextgsim-ue/drb-pdcp"]
# Enables the sidelink ranging end-to-end test (src/ranging_report_e2e.rs, issue
# #139). The SL-PRS stimulus and the positioning engine live in the UE's `sidelink`
# module, which #54's increment 1 gated off, so the ranging pipeline needs this
# feature as well as `ranging_config.enabled` at run time.
sidelink = ["nextgsim-ue/sidelink"]
# Enables the user-plane security end-to-end test (src/up_security_user_plane.rs),
# which needs K_UPenc/K_UPint applied on BOTH ends (issue #32). Forwarded to both
# crates together for the same reason as `drb-pdcp`: a gNB that protects against a
# UE that does not takes the user plane down rather than degrading it, and the test
# asserts exactly that.
up-security = ["nextgsim-gnb/up-security", "nextgsim-ue/up-security"]
# Enables the SDAP user-plane end-to-end test (src/sdap_user_plane.rs, issue #44),
# which needs the sublayer on BOTH ends. Forwarded to both crates together for the
# same reason as `drb-pdcp` and `up-security`: a gNB that prepends a one-octet SDAP
# header to a UE that does not strip it has the UE read the header as the first
# octet of its IP packet, so there is no configuration in which enabling one alone
# is useful — and the test asserts exactly the QFI→DRB split the pair produces.
sdap-dataplane = ["nextgsim-gnb/sdap-dataplane", "nextgsim-ue/sdap-dataplane"]

[dependencies]
# Internal crates
nextgsim-common = { path = "../nextgsim-common" }
nextgsim-crypto = { path = "../nextgsim-crypto" }
nextgsim-nas = { path = "../nextgsim-nas" }
nextgsim-ngap = { path = "../nextgsim-ngap" }
nextgsim-rrc = { path = "../nextgsim-rrc" }
nextgsim-rls = { path = "../nextgsim-rls" }
nextgsim-gtp = { path = "../nextgsim-gtp" }
nextgsim-pdcp = { path = "../nextgsim-pdcp" }
# For the SRAP header of TS 38.351, decoded at the relay's Uu boundary in
# `sidelink_pc5_e2e` (issue #190).
nextgsim-rlc = { path = "../nextgsim-rlc" }
nextgsim-sctp = { path = "../nextgsim-sctp" }
nextgsim-gnb = { path = "../nextgsim-gnb" }
nextgsim-ue = { path = "../nextgsim-ue" }

# 6G AI-native network function crates
nextgsim-ai = { path = "../nextgsim-ai" }
nextgsim-she = { path = "../nextgsim-she" }
nextgsim-nwdaf = { path = "../nextgsim-nwdaf" }
nextgsim-nkef = { path = "../nextgsim-nkef" }
nextgsim-isac = { path = "../nextgsim-isac" }
nextgsim-agent = { path = "../nextgsim-agent" }
nextgsim-fl = { path = "../nextgsim-fl" }
nextgsim-semantic = { path = "../nextgsim-semantic" }

# Async runtime
tokio = { version = "1", features = ["full", "test-util"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Utilities
bytes = "1"
hex = "0.4"
async-trait = "0.1"
futures = "0.3"

[lib]
name = "integration_tests"
path = "src/lib.rs"

[[test]]
name = "ue_registration"
path = "src/ue_registration.rs"

[[test]]
name = "pdu_session"
path = "src/pdu_session.rs"

[[test]]
name = "user_plane"
path = "src/user_plane.rs"

[[test]]
name = "multi_ue"
path = "src/multi_ue.rs"

[[test]]
name = "ai_integration"
path = "src/ai_integration.rs"

[[test]]
name = "e2e_scenario"
path = "src/e2e_scenario.rs"

[[test]]
name = "cross_crate_integration"
path = "src/cross_crate_integration.rs"

[[test]]
name = "sixg_task_integration"
path = "src/sixg_task_integration.rs"

[[test]]
name = "rrc_handshake"
path = "src/rrc_handshake.rs"

[[test]]
name = "paging_mt_service_request"
path = "src/paging_mt_service_request.rs"

[[test]]
name = "rlc_two_session_user_plane"
path = "src/rlc_two_session_user_plane.rs"

# The NTN SIB19 end-to-end test (issue #56): the gNB broadcasts its ephemeris and the
# UE applies a non-zero autonomous timing advance derived from it. Deliberately NOT
# feature-gated, unlike the four below it -- the NTN path is inert unless a cell
# carries an `ntn_config` block, so there is no default-build behaviour for a gate to
# protect, and gating it would keep the enabled arm out of `cargo test --workspace`.
[[test]]
name = "ntn_sib19_timing_e2e"
path = "src/ntn_sib19_timing_e2e.rs"

[[test]]
name = "drb_pdcp_user_plane"
path = "src/drb_pdcp_user_plane.rs"

[[test]]
name = "up_security_user_plane"
path = "src/up_security_user_plane.rs"

[[test]]
name = "ranging_report_e2e"
path = "src/ranging_report_e2e.rs"

# The two-UE PC5 end-to-end test (issue #141): discovery -> unicast link -> relay, with
# three real SidelinkTasks wired to each other's real inboxes. Behind `sidelink` for the
# same reason `ranging_report_e2e` is -- the whole sidelink module is gated off by
# default (#54), so this cannot compile in the default build.
[[test]]
name = "sidelink_pc5_e2e"
path = "src/sidelink_pc5_e2e.rs"

[[test]]
name = "conditional_handover_e2e"
path = "src/conditional_handover_e2e.rs"

[[test]]
name = "sdap_user_plane"
path = "src/sdap_user_plane.rs"
