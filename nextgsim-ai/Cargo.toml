[package]
name = "nextgsim-ai"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "AI/ML inference infrastructure for nextgsim - 6G AI-native network functions"

[features]
default = []
# Shared, reusable ONNX model registry (issue #17): load-by-id, versioning,
# warmup, with engines shared as `Arc<OnnxEngine>`. Off by default; consumer
# wiring is additive, so their existing direct `load_model` paths are untouched.
#
# With it on, a model can also be registered *verified* (nextgsim#463): a
# manifest pins its sha256, opset, input/output shapes and golden vectors, and
# the model is activated only when every check passes.
model-registry = ["dep:sha2"]

[dependencies]
# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Utilities
async-trait = { workspace = true }

# ONNX Runtime for ML inference
ort = { workspace = true }

# ndarray for tensor operations
ndarray = { workspace = true }

# Half-precision floats
half = { workspace = true }

# Random number generation
rand = { workspace = true }

# The model manifest's sha256 check (nextgsim#463), only with `model-registry`.
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
tracing-subscriber = { workspace = true }

[lints]
workspace = true
