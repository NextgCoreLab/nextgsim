[package]
name = "nextgsim-rrc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "RRC protocol library for nextgsim"

[lints]
workspace = true

[dependencies]
nextgsim-common.workspace = true
# For the shortMAC-I of TS 38.331 5.3.7.4: the NIA integrity algorithms. This
# crate owns VarShortMAC-Input, so it is where the one implementation both the UE
# and the gNB call belongs. nextgsim-crypto depends only on nextgsim-common, so
# there is no cycle.
nextgsim-crypto.workspace = true
# For the SRAP bearer and egress-channel types of TS 38.351 (issue #190). The
# `sl-SRAP-Config-r17` this crate encodes and the SRAP header `nextgsim-rlc` writes must
# agree on which bearer identities are legal, so they share one type rather than each
# keeping a `u8` that could drift apart. `nextgsim-rlc` depends only on
# `nextgsim-common`, so there is no cycle.
nextgsim-rlc.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
asn1-codecs.workspace = true
asn1_codecs_derive.workspace = true
bitvec.workspace = true
log.workspace = true

[build-dependencies]
asn1-compiler.workspace = true

[dev-dependencies]
proptest.workspace = true
