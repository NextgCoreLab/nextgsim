apiVersion: apps/v1
kind: Deployment
metadata:
  name: ue
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: ue
    app.kubernetes.io/part-of: nextgsim
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ue
        app.kubernetes.io/part-of: nextgsim
    spec:
      initContainers:
        - name: wait-gnb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              # Waits for the gNB's RLS listener rather than sleeping 5s after
              # DNS resolves. RLS is UDP, so `nc -z` cannot confirm a listener;
              # gate on DNS here and let the gNB's own readiness probe (which
              # checks the 4997 bind) provide the ordering guarantee.
              echo "[wait-gnb] waiting for gNB DNS..."
              i=0
              until nslookup gnb.nextg-system.svc.cluster.local >/dev/null 2>&1; do
                i=$((i+1))
                [ "$i" -ge 60 ] && { echo "[wait-gnb] FATAL: gNB DNS never resolved"; exit 1; }
                sleep 2
              done
              echo "[wait-gnb] gNB DNS resolves."
        - name: resolve-dns
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu

              # busybox ships no getent, so nslookup with an anchored parse.
              # See gnb.yaml for why the ^Name: anchor matters (without it the
              # DNS server's own address is returned instead of the answer).
              resolve() {
                _host="$1"; _ip=""; _i=0
                while [ "$_i" -lt 60 ]; do
                  _ip=$(nslookup "$_host" 2>/dev/null \
                        | awk '/^Name:/{n=1;next} n&&/^Address( 1)?:/{print $NF; exit}')
                  case "$_ip" in
                    *.*.*.*) echo "$_ip"; return 0 ;;
                  esac
                  _i=$((_i+1))
                  echo "[resolve-dns] waiting for $_host ($_i/60)" >&2
                  sleep 2
                done
                echo "[resolve-dns] FATAL: could not resolve $_host" >&2
                return 1
              }

              GNB_IP=$(resolve gnb.nextg-system.svc.cluster.local)
              case "$GNB_IP" in
                *[0-9].[0-9]*) ;;
                *) echo "[resolve-dns] FATAL: GNB_IP is not an IPv4 address: '$GNB_IP'" >&2; exit 1 ;;
              esac
              echo "[resolve-dns] gNB IP: $GNB_IP"

              cp /tmp/config-template/ue.yaml /etc/nextgsim/ue.yaml
              sed -i "s|gnb\.nextg-system\.svc\.cluster\.local|$GNB_IP|g" /etc/nextgsim/ue.yaml

              # A surviving hostname here is worse than elsewhere: gnb_search_list
              # is Vec<String>, so the UE deserializes it fine and then rejects
              # the entry when converting to SocketAddr. Catch it now.
              if grep -qE 'svc\.cluster\.local' /etc/nextgsim/ue.yaml; then
                echo "[resolve-dns] FATAL: unresolved names remain:" >&2
                grep -nE 'svc\.cluster\.local' /etc/nextgsim/ue.yaml >&2
                exit 1
              fi

              echo "[resolve-dns] final ue.yaml:"
              cat /etc/nextgsim/ue.yaml
          volumeMounts:
            - name: config-template
              mountPath: /tmp/config-template/ue.yaml
              subPath: ue.yaml
              readOnly: true
            - name: config-resolved
              mountPath: /etc/nextgsim
      containers:
        - name: ue
          image: nextgsim-ue:latest
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/nextgsim/ue.yaml"]
          ports:
            - containerPort: 4998
              name: cli
              protocol: UDP
          env:
            - name: RUST_LOG
              value: "info,nextgsim_ue=debug,nextgsim_nas=debug,nextgsim_rls=debug"
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Deliberately no socket-based probe. The UE binds no fixed port:
          # the RLS socket is 0.0.0.0:0 (rls/task.rs:170, ephemeral) and the CLI
          # server is 127.0.0.1 on a random port (cli_server.rs:24,272). A probe
          # on 4998 would fail on a perfectly healthy UE and crash-loop it.
          #
          # Note the containerPort/Service on 4998 below are inherited and do not
          # correspond to anything the UE actually binds; the CLI is
          # localhost-only and so unreachable from outside the pod regardless.
          #
          # The UE is a client -- nothing depends on its readiness -- so absence
          # of a probe is correct here rather than a gap. Registration success is
          # asserted by the E2E suite from logs, which is the real signal.
          volumeMounts:
            - name: config-resolved
              mountPath: /etc/nextgsim
              readOnly: true
            - name: dev-tun
              mountPath: /dev/net/tun
      volumes:
        - name: config-template
          configMap:
            name: nextgsim-configs
        - name: config-resolved
          emptyDir: {}
        - name: dev-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: ue
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: ue
    app.kubernetes.io/part-of: nextgsim
spec:
  selector:
    app.kubernetes.io/name: ue
  ports:
    - name: cli
      port: 4998
      targetPort: 4998
      protocol: UDP
