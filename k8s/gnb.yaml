apiVersion: v1
kind: Service
metadata:
  name: gnb
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: gnb
    app.kubernetes.io/part-of: nextgsim
spec:
  selector:
    app.kubernetes.io/name: gnb
  ports:
    - name: rls
      port: 4997
      targetPort: 4997
      protocol: UDP
    - name: gtpu
      port: 2152
      targetPort: 2152
      protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gnb
  namespace: nextg-system
  labels:
    app.kubernetes.io/name: gnb
    app.kubernetes.io/part-of: nextgsim
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: the gNB is a singleton radio
  # identity. In a rolling update two gNB pods would advertise the same cell
  # (NR-CGI) to the AMF at once, and a UE restarted in the overlap attaches to
  # the OLD gNB and is stranded when it terminates (#290).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gnb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gnb
        app.kubernetes.io/part-of: nextgsim
    spec:
      initContainers:
        - name: wait-amf
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              # Waits on the AMF actually being reachable. The previous version
              # slept 5s and printed that the AMF "should be ready", which is a
              # guess: on a cold cluster pulling images 5s is not enough and the
              # gNB then fails NG Setup against an AMF that is not listening.
              echo "[wait-amf] waiting for AMF DNS..."
              i=0
              until nslookup amf.nextg-system.svc.cluster.local >/dev/null 2>&1; do
                i=$((i+1))
                [ "$i" -ge 60 ] && { echo "[wait-amf] FATAL: AMF DNS never resolved"; exit 1; }
                sleep 2
              done
              echo "[wait-amf] AMF DNS resolves."
              # NGAP is userspace SCTP over UDP, so a TCP connect check against
              # 38412 would always fail. Probe the AMF SBI port instead: it is
              # TCP and comes up in the same process.
              i=0
              until nc -z amf.nextg-system.svc.cluster.local 7777; do
                i=$((i+1))
                [ "$i" -ge 60 ] && { echo "[wait-amf] FATAL: AMF SBI never accepted"; exit 1; }
                echo "[wait-amf] waiting for AMF SBI... ($i/60)"
                sleep 2
              done
              echo "[wait-amf] AMF ready."
        - name: resolve-dns
          image: busybox:1.36
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command:
            - sh
            - -c
            - |
              set -eu

              assert_ip() {
                case "$2" in
                  *[0-9].[0-9]*) ;;
                  *) echo "[resolve-dns] FATAL: $1 is not an IPv4 address: '$2'" >&2; exit 1 ;;
                esac
              }

              echo "[resolve-dns] pod IP: $POD_IP"
              assert_ip POD_IP "$POD_IP"

              cp /tmp/config-template/gnb.yaml /etc/nextgsim/gnb.yaml

              # Only the gNB's OWN addresses are substituted. link_ip/ngap_ip/
              # gtp_ip must be the pod IP, not 0.0.0.0: the gNB advertises them
              # in NGAP and GTP-U, and a peer told 0.0.0.0 has nowhere to send
              # return traffic. Anchored to the key so a bare 0.0.0.0 elsewhere
              # in the file is not rewritten.
              #
              # The AMF and UPF stay Service NAMES (nextgsim #286): the gNB
              # resolves them itself, re-resolves the AMF while connected and on
              # every reconnect, and re-runs NG Setup, so an AMF pod that comes
              # back at a new IP is found again without restarting this pod. A
              # literal resolved here once would be stale after that restart.
              sed -i \
                -e "s|^\( *link_ip:\).*|\1 $POD_IP|" \
                -e "s|^\( *ngap_ip:\).*|\1 $POD_IP|" \
                -e "s|^\( *gtp_ip:\).*|\1 $POD_IP|" \
                /etc/nextgsim/gnb.yaml

              if grep -qE '0\.0\.0\.0' /etc/nextgsim/gnb.yaml; then
                echo "[resolve-dns] FATAL: unresolved values remain:" >&2
                grep -nE '0\.0\.0\.0' /etc/nextgsim/gnb.yaml >&2
                exit 1
              fi

              echo "[resolve-dns] final gnb.yaml:"
              cat /etc/nextgsim/gnb.yaml
          volumeMounts:
            - name: config-template
              mountPath: /tmp/config-template/gnb.yaml
              subPath: gnb.yaml
              readOnly: true
            - name: config-resolved
              mountPath: /etc/nextgsim
      containers:
        - name: gnb
          image: nextgsim-gnb:latest
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/nextgsim/gnb.yaml"]
          ports:
            - containerPort: 4997
              name: rls
              protocol: UDP
            - containerPort: 2152
              name: gtpu
              protocol: UDP
          env:
            - name: RUST_LOG
              value: "info,nextgsim_gnb=debug,nextgsim_sctp=debug,nextgsim_ngap=debug,nextgsim_gtp=debug"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config-resolved
              mountPath: /etc/nextgsim
              readOnly: true
          # `kill -0 1` only asked whether PID 1 exists, which is true for any
          # process that has not exited -- including one wedged, deadlocked, or
          # never having bound its socket. The RLS listener on UDP 4997 is the
          # first thing a UE needs, so bind state is the useful signal.
          #
          # /proc/net/udp rather than netstat/ss: Dockerfile.gnb-local installs
          # only ca-certificates and libsctp1, so neither net-tools nor
          # iproute2 exists and a netstat probe would fail on a healthy pod and
          # crash-loop it. 4997 = 0x1385.
          readinessProbe:
            exec:
              command: ["sh", "-c", "grep -qi ':1385' /proc/net/udp"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "grep -qi ':1385' /proc/net/udp"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: config-template
          configMap:
            name: nextgsim-configs
        - name: config-resolved
          emptyDir: {}
